<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NS100｜人生冒險棋 試玩版</title><style>
*{box-sizing:border-box}body{margin:0;background:#071827;color:#eff9f8;font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:720px;margin:auto;padding:20px 14px 70px}h1{font-size:clamp(28px,7vw,44px);line-height:1.25;margin:14px 0}h2{font-size:24px;margin:4px 0 12px}h3{margin:8px 0}p{color:#b9d2d7}button,input,select{font:inherit}button{cursor:pointer}.tag{font-size:12px;color:#7ef0d4;letter-spacing:.15em;font-weight:800}.card{background:#112c3b;border:1px solid #356272;border-radius:22px;padding:20px;margin:14px 0}.btn{border:1px solid #457a80;border-radius:13px;padding:13px 16px;background:#1c4350;color:white;width:100%;margin:7px 0;text-align:left}.btn.primary{background:#71e4c7;color:#08313b;border:0;font-weight:800;text-align:center}.btn:disabled{opacity:.4}.muted{font-size:12px;color:#a8c3c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#092131;border-radius:12px;padding:10px;text-align:center;font-size:12px}.stat b{display:block;font-size:19px;color:#fff}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{min-height:66px;background:#203d4e;border:1px solid #466977;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center}.tile .emoji{font-size:24px}.tile.on{background:#2e7369;border:3px solid #8df8d9;box-shadow:0 0 13px #75e9d350}.tile.past{opacity:.5}.scene{height:200px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#184a69,#488e8a)}.sun{position:absolute;right:55px;top:20px;width:65px;height:65px;border-radius:50%;background:#ffe0a1;box-shadow:0 0 35px #ffcf8d}.mountain{position:absolute;bottom:45px;width:120%;height:90px;background:#306b71;clip-path:polygon(0 100%,17% 20%,33% 100%,58% 0,82% 100%,100% 32%,100% 100%)}.road{position:absolute;bottom:-35px;left:30%;width:40%;height:115px;background:#b9d4c6;clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}.road:after{content:'';position:absolute;left:49%;top:0;width:3px;height:100%;background:repeating-linear-gradient(#fff 0 12px,transparent 12px 22px);animation:move .8s linear infinite}.person{position:absolute;bottom:46px;left:48%;font-size:44px;animation:bob .5s ease-in-out infinite alternate}.scene-label{position:absolute;left:12px;top:12px;background:#0a2634b8;padding:5px 10px;border-radius:12px;font-size:12px}.dice{font-size:64px;text-align:center;line-height:1.2}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.options button{margin:0}.type{padding:10px;background:#1a3e4a;border-radius:10px;border:1px solid #527b83;color:white}.type.active{background:#2e7467;border:2px solid #a1f2dc}.timeline{border-left:2px solid #69d6c0;margin-left:7px;padding-left:18px}.timeline div{margin:14px 0}.info{background:#163d45;border-left:4px solid #7ce4c7;padding:14px;border-radius:8px}.step{font-size:12px;color:#b4dbd7}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #5c8590;background:#092638;color:white}.portrait{display:inline-flex;width:70px;height:70px;border-radius:18px;align-items:center;justify-content:center;background:linear-gradient(145deg,#f1d8bb,#87b8b1);font-size:44px}.head{display:flex;align-items:center;gap:14px}.head .portrait{flex-shrink:0}.actions{display:flex;gap:8px}.actions .btn{text-align:center}.foot{font-size:12px;color:#9db9c0;margin-top:24px}@keyframes bob{to{transform:translateY(-7px)}}@keyframes move{to{background-position:0 22px}}@media(prefers-reduced-motion:reduce){.person,.road:after{animation:none}}@media print{body{background:white;color:black}.btn,.scene,.board,.foot{display:none}.card{color:black}p{color:#333}}
</style></head><body><main><div class="tag">NS100 · LIFE MONOPOLY / DEMO V1</div><div id="app"></div><div class="foot">教育體驗原型｜金額、事件及保險減免均為虛構遊戲數值，不代表南山人壽商品條款、保費或理賠承諾。</div></main><script>
const cards=[
['🏥','醫療險','因疾病或傷害發生符合契約約定的住院、手術或其他醫療情況時','協助分擔約定醫療費用，或依契約提供定額給付。','實支實付、日額與手術給付不同；是否理賠依商品條款。'],
['🚑','意外險','發生符合契約定義的意外傷害事故時','可依約定提供意外醫療、失能或身故等保障。','疾病通常不能直接當作意外事故，須注意事故定義及除外責任。'],
['❤️','重大疾病／特定傷病險','確診符合契約定義與條件的疾病時','協助面對治療、休養與收入中斷的財務壓力。','重大疾病、重大傷病與特定傷病並不完全相同。'],
['🎗️','癌症險','符合契約所定義的癌症診斷或治療條件時','依商品設計提供罹癌、住院、手術或特定療程等給付。','癌症分期、原位癌與初期癌症的給付可能不同。'],
['🧓','長期照顧險','符合契約約定的長期照顧狀態時','協助安排照護服務與長期生活費用。','高齡不等於一定符合給付標準，仍需符合契約認定條件。'],
['🛡️','壽險','被保險人身故或符合契約約定的其他給付條件時','提供受益人約定保險金，協助家庭因經濟支柱離世產生的財務壓力。','壽險並非一般生病住院就會理賠。']
];
const mbti=['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP','ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ'],titles=['物流師','守護者','提倡者','建築師','鑑賞家','探險家','調停者','邏輯學家','企業家','表演者','競選者','辯論家','總經理','執政官','主人公','指揮官'];
const tiles=[['🏠','出生','family',0],['🛡️','保障','cover',6],['🎁','機會','chance',12],['🏥','醫療','medical',18],['📚','成長','family',24],['🚑','意外','accident',30],['💰','財務','finance',36],['❤️','重疾','critical',43],['🛡️','保障','cover',50],['💼','職涯','finance',57],['🧓','長照','care',64],['🎁','機會','chance',71],['🏥','醫療','medical',78],['👨‍👩‍👧','家庭','family',85],['🏁','百歲','end',100]];
const events={
family:[['家庭的重要選擇','家庭希望為孩子安排更安心的成長環境。',[['先安排健康檢查與活動',-9000,9,5],['預留家庭緊急預備金',18000,0,-2]]],'家庭與生活品質會互相影響，保險只是整體風險管理的一部分。'],
cover:[['保障規劃時刻','你有一筆預算，可以選擇配置一類模擬保障。',[['配置醫療保障',-12000,0,0,'medical'],['配置意外保障',-9000,0,0,'accident'],['配置長照保障',-18000,0,0,'care'],['先保留資金',10000,0,0]]],'保險應依需求、負擔能力與條款規劃；保障不等於所有損失都能理賠。'],
chance:[['人生的驚喜','你獲得一次額外機會，會怎麼運用？',[['投入進修',-8000,0,12],['增加儲蓄',22000,0,-2]]],'預備金與風險分散能幫助家庭應對不確定性。'],
medical:[['突發住院','你因疾病住院，需要一筆醫療支出。',[['接受治療並休養',-45000,-9,2],['安排家人協助照顧',-30000,-6,-3]]],'醫療險可能在符合契約條件時協助分攤醫療支出；不同商品的給付方式不同。'],
accident:[['交通意外','一次交通事故造成治療與復健需求。',[['專心復健',-65000,-12,4],['減少休息以維持收入',-40000,-18,-7]]],'意外保障須符合契約對意外傷害事故的定義。'],
finance:[['職涯與財務','你面臨職涯和收入的選擇。',[['投資自己與技能',-18000,0,8],['優先累積存款',30000,0,-3]]],'財務安全需要現金流、儲蓄與保障共同搭配。'],
critical:[['重大疾病挑戰','一項健康狀況需要較長期的治療與休養。',[['積極治療並休養',-120000,-17,2],['尋求家庭支援',-90000,-13,-4]]],'重大疾病與特定傷病的理賠條件依商品定義，並非所有疾病都適用。'],
care:[['照顧需求增加','家庭出現長期照顧需求，需要安排照護資源。',[['安排專業照護',-95000,-5,3],['以家庭照護為主',-55000,-8,-8]]],'長照保障以契約約定的照顧狀態及認定條件為準。']
};
let s={page:'home'},store=()=>localStorage.setItem('ns100_board_v1',JSON.stringify(s)),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),fmt=x=>'NT$ '+Math.round(x).toLocaleString('zh-TW');
function newGame(){s={page:'setup',name:'',gender:'不指定',type:'ENFJ',pos:0,money:100000,health:90,joy:65,medical:false,accident:false,care:false,critical:false,log:[],roll:0};store();render()}
function setup(){let name=document.getElementById('name').value.trim();if(!name)return alert('請先輸入角色名稱');s.name=name;s.page='board';store();render()}
function choose(k,v){s[k]=v;store();render()}
function roll(){if(s.pos>=tiles.length-1)return;s.roll=1+Math.floor(Math.random()*6);s.pos=Math.min(tiles.length-1,s.pos+s.roll);if(s.pos===tiles.length-1){s.page='report'}else{s.page='event';s.eventType=tiles[s.pos][2]}store();render()}
function choice(i){let e=events[s.eventType],a=e[2][i];s.money+=a[1];s.health=Math.max(0,Math.min(100,s.health+a[2]));s.joy=Math.max(0,Math.min(100,s.joy+a[3]));if(a[4])s[a[4]]=true;let saved=0;if(s.eventType==='medical'&&s.medical)saved=18000;if(s.eventType==='accident'&&s.accident)saved=22000;if(s.eventType==='critical'&&s.critical)saved=40000;if(s.eventType==='care'&&s.care)saved=30000;s.money+=saved;s.log.push({age:tiles[s.pos][3],event:e[0],choice:a[0],money:a[1]+saved,saved,type:s.eventType});s.result={e:e[0],a:a[0],delta:a[1]+saved,saved,tip:e[3]};s.page='knowledge';store();render()}
function goBoard(){s.page='board';store();render()}
function nextCard(){s.card=(s.card||0)+1;if(s.card>=cards.length)s.page='done';store();render()}
function finish(){s.page='cards';s.card=0;store();render()}
function reset(){if(confirm('重新開始人生冒險棋？'))newGame()}
function portrait(){return '<div class="portrait">'+(s.gender==='女性'?'👩🏻':s.gender==='男性'?'👨🏻':'🧑🏻')+'</div>'}
function stats(){return '<div class="stats"><div class="stat">💰 模擬資產<b>'+fmt(s.money)+'</b></div><div class="stat">❤️ 健康<b>'+s.health+'/100</b></div><div class="stat">✨ 幸福<b>'+s.joy+'/100</b></div></div>'}
function landscape(){return '<div class="scene"><div class="sun"></div><div class="mountain"></div><div class="road"></div><div class="person">🚶</div><div class="scene-label">'+(tiles[s.pos]?.[3]||0)+' 歲 · '+(s.name||'人生旅人')+'</div></div>'}
function btn(label,fn,primary=false){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>'}
function render(){let h='';if(s.page==='home')h='<h1>人生不只一條路。<br><span style="color:#79ebd0">擲出你的百歲旅程</span></h1>'+landscape()+'<div class="card"><h2>NS100 人生冒險棋</h2><p>從 0 歲開始，用骰子前進、遭遇人生事件、學習風險與保障，最後回顧一生並閱讀完整保險知識圖鑑。</p>'+btn('開始新的人生 →','newGame()',true)+(localStorage.getItem('ns100_board_v1')?btn('繼續上次遊戲','resume()'):'')+'</div>';
if(s.page==='setup')h='<h1>創建你的角色</h1><div class="card"><h3>角色名稱</h3><input id="name" class="input" placeholder="輸入角色名字" maxlength="16" value="'+esc(s.name)+'"><h3>選擇性別</h3><div class="options">'+['女性','男性','不指定'].map(g=>'<button class="type '+(s.gender===g?'active':'')+'" onclick="choose(\'gender\',\''+g+'\')">'+g+'</button>').join('')+'</div><h3>選擇 MBTI 人格</h3><div class="options">'+mbti.map((t,i)=>'<button class="type '+(s.type===t?'active':'')+'" onclick="choose(\'type\',\''+t+'\')">'+t+' · '+titles[i]+'</button>').join('')+'</div><p class="muted">MBTI 為遊戲角色設定，並非人格測驗結果或能力預測。</p>'+btn('進入人生地圖 →','setup()',true)+'</div>';
if(s.page==='board')h='<div class="head">'+portrait()+'<div><h2>'+esc(s.name)+' 的人生地圖</h2><div class="muted">'+s.type+' · '+tiles[s.pos][3]+' 歲 · '+(s.pos+1)+' / '+tiles.length+' 格</div></div></div>'+landscape()+'<div class="card">'+stats()+'<h3>人生棋盤</h3><div class="board">'+tiles.map((t,i)=>'<div class="tile '+(i===s.pos?'on':i<s.pos?'past':'')+'"><div class="emoji">'+(i===s.pos?'🚶':t[0])+'</div>'+t[1]+'<span class="muted">'+t[3]+'歲</span></div>').join('')+'</div><div class="dice">'+('⚀⚁⚂⚃⚄⚅'[Math.max(0,s.roll-1)]||'🎲')+'</div>'+btn('🎲 擲骰子，前進 1～6 格','roll()',true)+'<p class="muted">本試玩版每格代表一個人生階段，擲骰結果會決定下一個事件。跨過的格子不會觸發事件。</p></div>';
if(s.page==='event'){let e=events[s.eventType];h='<div class="step">事件畫面 · '+tiles[s.pos][3]+' 歲</div><h1>'+tiles[s.pos][0]+' '+e[0]+'</h1><div class="card"><p>'+e[1]+'</p><h3>你會怎麼選？</h3>'+e[2].map((a,i)=>btn(a[0],'choice('+i+')')).join('')+'</div>'}
if(s.page==='knowledge'){let r=s.result;h='<div class="step">事件結果 → 知識卡</div><h1>這次的人生選擇</h1><div class="card"><h2>'+r.e+'</h2><p>你選擇了：'+r.a+'</p>'+stats()+'<p>本次資產變動：<b>'+fmt(r.delta)+'</b></p>'+(r.saved?'<p>模擬保障減免：'+fmt(r.saved)+'</p>':'')+'<div class="info"><b>保險與風險知識</b><p>'+r.tip+'</p></div>'+btn('返回人生大富翁地圖 →','goBoard()',true)+'</div>'}
if(s.page==='report'){h='<h1>'+esc(s.name)+' 的百歲人生回顧</h1>'+landscape()+'<div class="card">'+stats()+'<h2>你走過的人生事件</h2><div class="timeline">'+s.log.map(l=>'<div><b>'+l.age+' 歲 · '+l.event+'</b><p>'+l.choice+'｜資產變動 '+fmt(l.money)+'</p></div>').join('')+'</div><h3>你的保障配置</h3><p>'+[['medical','醫療'],['accident','意外'],['critical','重疾'],['care','長照']].map(([k,v])=>(s[k]?'✓ ':'○ ')+v).join('　')+'</p><p class="muted">遊戲中的人生事件及結果是隨機模擬，不代表真實人生預測。</p>'+btn('閱讀全部 6 張保險知識卡 →','finish()',true)+'</div>'}
if(s.page==='cards'){let c=cards[s.card];h='<div class="step">完整保險知識圖鑑 · '+(s.card+1)+' / '+cards.length+'</div><h1>'+c[0]+' '+c[1]+'</h1><div class="card"><h3>什麼時候可能用到？</h3><p>'+c[2]+'</p><h3>主要用途</h3><p>'+c[3]+'</p><div class="info"><b>注意事項</b><p>'+c[4]+'</p></div>'+btn(s.card===cards.length-1?'完成知識圖鑑 →':'下一張資訊卡 →','nextCard()',true)+'</div>'}
if(s.page==='done')h='<h1>百歲旅程完成 🎉</h1><div class="card"><h2>'+esc(s.name)+'，你完成了人生冒險棋！</h2><p>你已經回顧人生重大事件，也讀完醫療、意外、重大疾病、癌症、長照與壽險六類知識卡。</p>'+btn('重新體驗另一段人生','reset()',true)+btn('再看一次人生報告','viewReport()')+btn('再看一次完整知識圖鑑','finish()')+'</div>';
document.getElementById('app').innerHTML=h}
function viewReport(){s.page='report';store();render()}function resume(){try{let v=JSON.parse(localStorage.getItem('ns100_board_v1'));if(v&&v.page){s=v;render()}else newGame()}catch(e){newGame()}}render();
</script></body></html>
