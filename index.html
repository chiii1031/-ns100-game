<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091827">
<title>NS100｜百歲人生模擬實驗室</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  color:#eaf5f5;
  background:#071521;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 85% 0,#17475a,transparent 45%),#071521;
}
button,input{font:inherit}
button{cursor:pointer}
main{
  width:min(1160px,100%);
  margin:auto;
  padding:22px clamp(14px,3vw,32px) 60px;
}
.brand{
  color:#76e9d4;
  font-size:12px;
  letter-spacing:.19em;
  font-weight:850;
  display:flex;
  align-items:center;
  gap:10px;
}
.brand:before{
  content:'';
  height:8px;
  width:8px;
  border-radius:50%;
  background:#7ce9d6;
  box-shadow:0 0 16px #7ce9d6;
}
.muted{color:#a8c5ce;font-size:13px}
.lead{
  font-size:clamp(28px,4.5vw,48px);
  line-height:1.18;
  letter-spacing:-.03em;
  margin:18px 0 10px;
}
.sub{line-height:1.75;color:#bfd5da;margin:6px 0 14px}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(330px,.9fr);
  gap:20px;
  align-items:start;
}
.panel{
  background:linear-gradient(155deg,#112c3b,#0d2333);
  border:1px solid #31576a;
  border-radius:22px;
  padding:22px;
  box-shadow:0 16px 45px #0003;
}
.panel h2{font-size:22px;margin:0 0 8px}
.panel h3{font-size:16px;margin:16px 0 8px;color:#d6f5ef}
.button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:13px 16px;
  background:#1a3d4d;
  border:1px solid #467383;
  color:#f3ffff;
  border-radius:13px;
  text-align:center;
  font-weight:650;
  margin:8px 0;
  transition:background .2s,transform .2s;
}
.button:hover{background:#28596a;transform:translateY(-1px)}
.button.primary{background:#6ce1ca;color:#082b33;border:0;font-weight:750}
.button.primary:hover{background:#8cf2df}
.button:disabled{opacity:.45;cursor:not-allowed}
.button svg{width:19px;height:19px;flex-shrink:0}

/* Stage & Walking Animation (Preserved V1 Visuals) */
.stage{
  position:relative;
  overflow:hidden;
  height:clamp(280px,32vw,390px);
  border-radius:23px;
  border:1px solid #457382;
  background:linear-gradient(180deg,#12364e 0%,#215768 58%,#163d49 100%);
  isolation:isolate;
  transition:background 1.5s;
}
.stage.era-family{background:linear-gradient(180deg,#234760,#54817e 58%,#28564f 100%)}
.stage.era-park{background:linear-gradient(180deg,#304a66,#648c80 58%,#2c6258 100%)}
.sun{
  position:absolute;width:110px;height:110px;top:32px;right:12%;
  border-radius:50%;background:#ffe1a1;box-shadow:0 0 60px #f8cd8790;
}
.hill{
  position:absolute;bottom:66px;width:125%;left:-10%;height:142px;
  background:#225a5b;border-radius:55% 55% 0 0;transform:rotate(-7deg);
  transition:background 1.4s;
}
.hill.two{bottom:40px;left:35%;background:#2c6b64;transform:rotate(12deg)}
.era-family .hill{background:#416d68}
.era-park .hill{background:#367767}
.road{
  position:absolute;bottom:-145px;left:50%;width:210px;height:415px;
  background:#c4d9c8;
  transform:translateX(-50%) perspective(250px) rotateX(34deg);
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  border-radius:50% 50% 0 0;
}
.road:after{
  content:'';position:absolute;left:49%;top:15%;height:75%;width:3px;
  background:repeating-linear-gradient(to bottom,#fff 0 22px,transparent 22px 45px);
  animation:roadMove 1.6s linear infinite;
}
.walker{
  position:absolute;bottom:77px;left:50%;width:82px;height:134px;
  transform:translateX(-50%);
  animation:walkBounce .65s ease-in-out infinite alternate;
  filter:drop-shadow(0 8px 6px #082b3345);
}
.walker svg{width:100%;height:100%;overflow:visible}
.walker .left-arm{transform-origin:28px 54px;animation:limb .8s infinite alternate}
.walker .right-arm{transform-origin:54px 54px;animation:limb .8s infinite alternate-reverse}
.walker .left-leg{transform-origin:34px 90px;animation:limb .8s infinite alternate-reverse}
.walker .right-leg{transform-origin:48px 90px;animation:limb .8s infinite alternate}
.landmark{position:absolute;top:18px;left:20px;font-size:12px;color:#d8fff0;letter-spacing:.12em;font-weight:800}
.age-chip{position:absolute;bottom:16px;left:17px;font-size:13px;font-weight:750;color:#e6fff4}
.stage-sign{
  position:absolute;bottom:120px;right:10%;background:#f5eccc;color:#204750;
  padding:8px 12px;border-radius:7px;font-size:12px;font-weight:800;transform:rotate(5deg);
}
.stage-sign:after{content:'';position:absolute;top:100%;left:48%;height:38px;width:5px;background:#f5eccc}
.scenery{position:absolute;bottom:90px;left:5%;display:flex;gap:16px;align-items:end;opacity:.85;transition:opacity 1s}
.building{width:27px;height:var(--h);background:#183e50;border-radius:4px 4px 0 0;border-top:4px solid #4d8190}
.era-park .building{background:#2e695e;border-radius:50% 50% 4px 4px;border:0;width:37px}
.era-park .building:after{content:'';display:block;width:6px;height:28px;background:#31544c;margin:40px auto 0}
.era-family .building{background:#5c7770}

/* HUD & Stats */
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.career-badge{
  background:#163d4c;border:1px solid #487d8c;color:#9ef2df;
  padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;
}
.progress{height:7px;border-radius:10px;background:#254455;overflow:hidden}
.progress span{height:100%;display:block;background:linear-gradient(90deg,#6be0ca,#f2d49a);transition:width .8s}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}
.stat{padding:11px 10px;border:1px solid #2a4d5d;background:#0e2533;border-radius:14px;min-width:0}
.stat-head{display:flex;align-items:center;gap:6px;color:#aecbd0;font-size:11px}
.stat-head svg{width:15px;height:15px;color:#76e3d1}
.stat strong{display:block;font-size:clamp(14px,1.6vw,18px);white-space:nowrap;margin:5px 0 7px;letter-spacing:-.02em}
.stat .progress{height:5px}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;border:1px solid #3e7775;background:#163c44;
  border-radius:30px;padding:5px 11px;color:#a6f1df;
}
.tag.empty{border-color:#3d5662;color:#b3c9d0;background:#152b39}
.step{font-size:11px;font-weight:800;color:#7fe8d5;letter-spacing:.12em;margin-bottom:8px}

/* Options & Notes */
.options{display:grid;gap:9px}
.option{
  width:100%;border:1px solid #3b6574;background:#163748;color:#ecf9f8;
  padding:13px 15px;border-radius:13px;text-align:left;transition:background .2s,border-color .2s;
}
.option:hover{background:#245467;border-color:#6ce1ca}
.option:disabled{opacity:.45;cursor:not-allowed}
.option b{display:block;font-size:15px}
.option small{display:block;font-size:12px;color:#b3ced3;margin-top:4px;line-height:1.55}
.note{
  border-left:3px solid #6be1ca;background:#183b46;
  padding:13px 15px;border-radius:9px;line-height:1.7;color:#d5eeee;font-size:13.5px;
}
.note.warn{border-left-color:#f2b872;background:#2b3540}
.input{
  display:block;width:100%;background:#0c2635;border:1px solid #477384;
  border-radius:12px;padding:12px 14px;color:white;
}

/* 16 MBTI Grid */
.mbti-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-top:8px;
}
.mbti-btn{
  padding:9px 6px;
  border:1px solid #385e6d;
  background:#112f40;
  color:#efffff;
  border-radius:11px;
  text-align:center;
  transition:all .15s;
}
.mbti-btn:hover{background:#1b455a}
.mbti-btn.selected{border:2px solid #7ce7d1;background:#215262;box-shadow:0 0 12px #7ce7d133}
.mbti-btn b{display:block;font-size:14px;letter-spacing:.04em}
.mbti-btn span{display:block;font-size:11px;color:#b8d2d7;margin-top:2px}
.mbti-preview{
  display:flex;align-items:center;gap:14px;
  background:#133344;border:1px solid #3a6878;border-radius:14px;
  padding:12px 14px;margin:12px 0;
}
.mbti-preview svg{width:64px;height:86px;flex-shrink:0}

/* Knowledge Cards & Guide */
.divider{height:1px;background:#315365;margin:16px 0}
.change{color:#8bf1dc;font-size:13px;font-weight:700}
.history{border-left:2px solid #447d80;margin:14px 0 14px 8px;padding-left:18px}
.history article{margin:0 0 14px}
.history b{font-size:14px}
.history p{margin:3px 0;color:#bcd0d5;font-size:13px}
.report{background:linear-gradient(145deg,#1a4650,#102a3c);border:1px solid #77b6ab}
.report-hero{display:flex;align-items:center;gap:16px}
.report-hero svg{width:88px;height:114px;flex-shrink:0}
.report-hero h2{margin:0}
.result-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.result-numbers div{background:#0d2b38;border-radius:12px;padding:10px;text-align:center}
.result-numbers strong{display:block;font-size:20px}
.result-numbers small{color:#b8d0d4}

/* Rich Knowledge Card Styling */
.k-card{
  background:#133242;border:1px solid #427585;border-radius:14px;
  padding:14px 16px;margin:10px 0;
}
.k-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.k-badge{background:#235766;color:#9cf3e0;font-size:11px;font-weight:750;padding:3px 9px;border-radius:20px}
.k-grid{display:grid;gap:6px;font-size:13px;color:#cde3e6;line-height:1.6}
.k-row b{color:#8beedd}
.knowledge-list{display:grid;gap:10px}
.knowledge-list details{border:1px solid #3d6571;border-radius:12px;padding:12px 14px;background:#153645}
.knowledge-list summary{cursor:pointer;font-weight:750;display:flex;align-items:center;gap:8px;color:#eafffc}
.knowledge-list details[open] summary{margin-bottom:8px;color:#7fe8d5}
.foot{font-size:11px;color:#9bb7c1;line-height:1.7;margin-top:24px}

@keyframes limb{from{transform:rotate(-19deg)}to{transform:rotate(22deg)}}
@keyframes walkBounce{to{transform:translate(-50%,-4px)}}
@keyframes roadMove{to{background-position:0 45px}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}
.rolling{animation:shake .16s linear infinite;display:inline-flex}

@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .stage{height:310px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:460px){
  .mbti-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.mbti-btn{padding:8px 2px}.mbti-btn span{font-size:9px}
}
</style>
</head>

function knowledgeCard(key){const k=INSURANCE_TYPES[key];return `<div class="k-card"><div class="k-card-head"><b>${escapeHtml(k.name)}</b><span class="k-badge">保障知識</span></div><div class="k-grid"><div class="k-row"><b>這張保險在幹嘛</b><div>${escapeHtml(k.whatItDoes)}</div></div><div class="k-row"><b>推薦誰需要規劃</b><div>${escapeHtml(k.suitableFor)}</div></div><div class="k-row"><b>跟其他保險差在哪</b><div>${escapeHtml(k.diffNote)}</div></div></div></div>`;}
function book(){return `<div class="knowledge-list">${Object.keys(INSURANCE_TYPES).map(k=>`<details><summary>${icon('book',16)}${INSURANCE_TYPES[k].name}${state.cover.includes(k)?' · 已配置':' · 未配置'}</summary>${knowledgeCard(k)}</details>`).join('')}</div>`;}
function btn(label,action,primary=false,disabled=false,sub=''){return `<button class="button ${primary?'primary':''}" data-action="${action}" ${disabled?'disabled':''}>${label}${sub?`<small style="font-weight:400;opacity:.75">${sub}</small>`:''}</button>`;}
function choiceButtons(choices,kind){return choices.map((c,i)=>{const disabled=!!(c.cost&&!isAffordable(c.cost));return `<button class="option" data-action="${kind}:${i}" ${disabled?'disabled':''}><b>${escapeHtml(c.text)}</b><small>${c.cost?`支出 ${cash(c.cost)}`:c.gain?`收入 ${cash(c.gain)}`:'不需額外支出'} · 健康 ${c.health>0?'+':''}${c.health||0} · 幸福 ${c.joy>0?'+':''}${c.joy||0}${disabled?' · 目前存款不足':''}</small></button>`;}).join('');}

const SPIRITS=[["米格","小墨","喜歡提前規劃，擅長分析未來。"],["阿哲","米米","好奇又愛思考，喜歡探索問題背後的原理。"],["阿凱","妮卡","目標明確，喜歡挑戰與採取行動。"],["奇奇","可可","鬼點子多，喜歡打破框架。"],["阿森","小鹿","心思細膩，重視人生的意義。"],["小宇","朵朵","充滿想像力，珍惜夢想與內心感受。"],["阿暖","小晴","喜歡鼓勵別人，陪伴大家成長。"],["波波","妮妮","熱情好奇，喜歡探索新的可能。"],["阿石","小安","認真可靠，重視秩序與穩定。"],["阿福","小美","細心溫暖，喜歡默默照顧別人。"],["阿正","小艾","講求效率，擅長安排資源。"],["阿和","糖糖","熱心親切，重視人際和諧。"],["阿飛","小酷","冷靜獨立，擅長動手解決問題。"],["木木","小花","喜歡美好事物，享受自己的步調。"],["阿虎","莉莉","勇於冒險，擅長把握機會。"],["阿樂","桃桃","樂觀外向，喜歡分享生活的快樂。"]], QUESTIONS=[["如果今天突然多了一天假期，你會怎麼度過？","約朋友出去玩，享受熱鬧的時光。","待在自己的空間，好好享受獨處。","出門探索沒去過的地方，認識新朋友。","一個人做喜歡的事，探索新的興趣。"],["如果突然獲得一筆意外獎金，你會怎麼運用？","理性分配，優先考慮儲蓄與實際需求。","買一些能讓自己或家人開心的東西。","投入有發展潛力的新計畫。","實現一直以來想完成的夢想。"],["當人生出現意料之外的變化，你通常會怎麼做？","冷靜分析，重新制定計畫。","確認自己真正想要什麼，再安排下一步。","隨機應變，找出當下最有效的解決方法。","順其自然，相信變化也可能帶來驚喜。"],["如果可以選擇未來的人生，你最期待哪一種？","生活穩定，每個人生階段都有明確的安排。","不斷突破自己，逐步實現遠大的目標。","自由自在，享受生活中的每一刻。","充滿未知與可能性，隨時探索新的方向。"],["當你遇到人生低潮時，你最希望小精靈怎麼陪伴你？","幫我分析問題，一起找出解決方法。","靜靜陪在我身邊，理解我的感受。","鼓勵我重新振作，陪我一起採取行動。","帶我換個心情，發現人生其他的可能性。"]], SCORES=[['ES','IS','EN','IN'],['ST','SF','NT','NF'],['TJ','FJ','TP','FP'],['SJ','NJ','SP','NP'],['IT','IF','ET','EF']];
function spirit(){return SPIRITS[MBTI_ORDER.indexOf(state.mbti)];}
function spiritName(){return spirit()[state.spiritGender||0];}
function fairy(){const m=MBTI_DATA[state.mbti];return `<svg viewBox="0 0 120 110" width="100" role="img" aria-label="小精靈"><ellipse cx="27" cy="58" rx="18" ry="28" transform="rotate(-35 27 58)" fill="#a9eee5" opacity=".8"/><ellipse cx="93" cy="58" rx="18" ry="28" transform="rotate(35 93 58)" fill="#a9eee5" opacity=".8"/><path d="M43 69Q30 100 60 101Q90 100 77 69" fill="${m.coat}"/><circle cx="60" cy="43" r="29" fill="#ffdfbd"/><path d="M31 43Q28 8 60 12Q91 9 89 43L77 27Q55 40 31 43" fill="${m.hair}"/>${state.spiritGender?'<path d="M33 39Q22 58 37 75M87 39Q98 58 83 75" stroke="#72564c" stroke-width="9" fill="none" stroke-linecap="round"/>':''}<circle cx="50" cy="46" r="3" fill="#263849"/><circle cx="70" cy="46" r="3" fill="#263849"/><path d="M54 58Q60 64 66 58" stroke="#925f51" stroke-width="2" fill="none"/><path d="M60 0l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#ffe18a"/></svg>`;}
function answerSpirit(i){state.answers.push(i);if(state.answers.length===5){const a=state.answers.map((v,j)=>SCORES[j][v]);state.mbti=['EI','SN','TF','JP'].map((p,j)=>{const n=a.filter(x=>x.includes(p[0])).length,k=a.filter(x=>x.includes(p[1])).length;return n===k?(j===0?a[0]:a[2]).split('').find(x=>p.includes(x)):n>k?p[0]:p[1];}).join('');state.spiritGender=Math.random()<.5?0:1;}render();}
function creation(){const a=state.answers||(state.answers=[]),q=QUESTIONS[a.length];return `<h1 class="lead">尋找你的人生旅伴</h1><p class="sub">人生充滿未知，找到陪伴你走過這一生的小精靈吧！</p><div class="panel" style="max-width:720px;margin:auto">${q?`<div class="step">小精靈配對 · ${a.length+1} / 5</div><div class="progress"><span style="width:${a.length*20}%"></span></div><h2 style="margin-top:20px">${q[0]}</h2><div class="options">${q.slice(1).map((v,i)=>btn(v,'spirit:'+i)).join('')}</div>${a.length?btn('上一題','spiritBack'):''}`:`<div style="text-align:center"><div class="step">配對成功</div>${fairy()}<h2>你的命定小精靈：${spiritName()}</h2><p class="sub">${spirit()[2]}</p><p>從今天開始，就由我陪你走過這段人生旅程吧！</p></div><label for="player-name">請為自己取一個名字</label><input class="input" id="player-name" maxlength="18" placeholder="你希望小精靈怎麼稱呼你？"><div>${btn('開啟百歲人生','start',true)}${btn('重新配對','spiritReset')}</div>`}</div><p class="muted" style="text-align:center">趣味旅伴配對，非正式人格測驗。</p>`;}
function start(){if(state.answers?.length!==5)return;const input=$('player-name');if(!input?.value.trim()){input?.focus();return;}state.name=(input?.value||'').trim()||'人生旅人';const b={money:0,health:0,joy:0,salary:0};state.money=100000+b.money;state.health=clamp(85+b.health);state.joy=clamp(65+b.joy);state.salaryBonus=b.salary;state.cover=[];state.age=18;state.stageAge=18;state.turn=0;state.history=[];state.planStops=[];state.income=0;state.pressures=0;state.deathReason='';updateCareer();state.screen='board';state.notification=`你的初始職業：${state.career.title}，月薪 ${cash(state.career.basePay)}；每年調薪 ${cash(state.career.growth)}（皆為模擬值）。`;render();}
function board(){return `<h1 class="lead">${escapeHtml(state.name)} 的人生道路</h1><div class="stage-top"><span class="muted">旅伴：${spiritName()}</span><span class="career-badge">${state.age<65?state.career.title:'退休生活'}</span></div><div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">SURVIVAL MODE · ROUND ${state.turn+1} · 高壓抉擇 ${state.pressures} 次</div><h2>下一段人生，會發生什麼？</h2><p class="sub">擲出 1～6 點，向前走點數 + 5 歲。每次結算工作與生活淨收支、自然健康衰退，再遇見人生抉擇。部分回合有高壓事件，百歲前也可能提前結束。</p>${btn(icon('dice')+' 推進人生（擲骰子）','roll',true)}${state.notification?`<div class="note">${escapeHtml(state.notification)}</div>`:''}</div></section><aside class="panel"><div class="step">CAREER & FINANCE</div><h2>工作與收入</h2><p class="sub">${state.career.title}｜起薪 ${cash(state.career.basePay)}／月｜每年調薪 ${cash(state.career.growth)}／月</p><div class="note">最近一回合淨收支：${state.income<0?'-':''}${cash(Math.abs(state.income))}。淨儲蓄採模擬薪資的一定比例，已假設扣除日常生活支出；65 歲後改計模擬退休金。</div><h3>人生轉折紀錄</h3><div class="history">${state.history.slice(-4).reverse().map(h=>`<article><b>${h.age} 歲｜${escapeHtml(h.title)}</b><p>${escapeHtml(h.desc)}</p></article>`).join('')||'<p class="muted">尚無紀錄</p>'}</div></aside></div>`;}
function roll(){if(locked||state.screen!=='board')return;locked=true;state.roll=1+Math.floor(Math.random()*6);const from=state.age;const to=Math.min(100,from+state.roll+5);state.income=incomeForYears(from,to);state.money=Math.max(0,state.money+state.income);lifeDecay(from,to);state.age=to;state.turn++;state.notification=`骰出 ${state.roll} 點，前進 ${to-from} 歲；本段淨收支 ${state.income<0?'-':''}${cash(Math.abs(state.income))}。`;state.screen='rolling';render();setTimeout(()=>{state.stageAge=to;locked=false;if(to>=100){finish();return;}if((from<25&&to>=25&&!state.planStops.includes('early'))||(state.turn===1&&!state.planStops.includes('early'))){state.planStops.push('early');state.screen='plan';state.pending={plan:'early'};}else if(from<45&&to>=35&&!state.planStops.includes('middle')){state.planStops.push('middle');state.screen='plan';state.pending={plan:'middle'};}else{drawEvent();}render();},620);}
function drawEvent(){if(pressureNeeded()){pressureEvent();return;}const risk=Math.random()<.20;const pool=(risk?RISK_EVENTS:DAILY_EVENTS).filter(e=>e.min<=state.age&&e.max>=state.age);const fallback=(risk?RISK_EVENTS:DAILY_EVENTS);const e=rand(pool.length?pool:fallback);state.pending={...e,risk};state.screen='event';}
function plan(){const early=state.pending.plan==='early';return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">PROTECTION PLANNING</div><h2>${early?'第一站｜剛開始工作的保障規劃':'第二站｜家庭責任與進階保障'}</h2><p class="sub">你可以從有限預算中選擇一組保障。已配置的類別不會重複收費；這是一次性的遊戲預算，不代表實際保費。</p><div class="options">${PLANS.map((p,i)=>{const fresh=p.keys.filter(k=>!state.cover.includes(k));const price=Math.round(p.cost*fresh.length/p.keys.length);const dis=!fresh.length||!isAffordable(price);return `<button class="option" data-action="plan:${i}" ${dis?'disabled':''}><b>${p.title}</b><small>${p.desc}<br>本次模擬支出 ${cash(price)}${!fresh.length?' · 已全數配置':!isAffordable(price)?' · 目前存款不足':''}</small></button>`;}).join('')}</div>${btn('先保留現金，暫不投保','skipPlan')}</div></section><aside class="panel"><h2>七大保障，先認識再決定</h2><p class="muted">展開可看三個白話欄位。</p>${book()}</aside></div>`;}
function buyPlan(i){const p=PLANS[i];if(!p)return;const fresh=p.keys.filter(k=>!state.cover.includes(k));const price=Math.round(p.cost*fresh.length/p.keys.length);if(!fresh.length||!isAffordable(price))return;spend(price);state.cover.push(...fresh);state.pending={kind:'purchase',keys:fresh,amount:price};state.screen='knowledge';addHistory('完成保障規劃',`配置 ${fresh.map(k=>INSURANCE_TYPES[k].tag).join('、')}，模擬支出 ${cash(price)}`,true);render();}
function skipPlan(){addHistory('暫緩保障規劃','選擇先保留資金，未新增保障。',true);drawEvent();render();}
function eventPage(){const e=state.pending;return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">${e.pressure?'SCARCITY DECISION':e.risk?'RISK EVENT':'DAILY LIFE'} · ${state.age} 歲</div><h2>${escapeHtml(e.title)}</h2><p class="sub">${escapeHtml(e.story)}</p>${e.risk?`<div class="note warn">這是隨機風險事件，模擬支出 ${cash(e.cost)}。系統將依先前配置的保障類別試算，實際保險是否給付須依契約條款。</div>${btn('查看風險結算','resolveRisk',true)}`:`<h3>你會怎麼選？</h3><div class="options">${choiceButtons(e.choices,'daily')}</div>`}</div></section><aside class="panel"><h2>這段人生的收入</h2><p class="sub">本回合從 ${Math.max(18,state.age-(state.roll+5))} 歲左右前進至 ${state.age} 歲，已結算 ${state.income<0?'-':''}${cash(Math.abs(state.income))} 的淨收支。</p><div class="note">每回合有年齡相關的健康與幸福衰減，資源不易永久滿分。選擇日常事件會影響存款、健康與幸福。你可以與不同小精靈重新體驗另一段人生。</div></aside></div>`;}
function dailyChoice(i){const e=state.pending,c=e.choices[i];if(!c||!applyChoice(c))return;addHistory(e.title,`${c.text}。${c.tip}`,false);state.pending={kind:'daily',title:e.title,choice:c.text,tip:c.tip,knowledge:c.knowledge,pressure:!!e.pressure};state.screen='result';if(state.health<=0){state.deathReason='健康資源耗盡';finish();return;}render();}
function resolveRisk(){const e=state.pending;if(!e?.risk)return;const matching=e.cover.filter(k=>state.cover.includes(k));const insured=matching.length>0;const reduction=insured?Math.round(e.cost*.8):0;const outOfPocket=e.cost-reduction;const before=state.money;spend(outOfPocket);state.health=clamp(state.health+e.health);state.joy=clamp(state.joy+e.joy+(insured?7:0));const exhausted=state.money===0&&outOfPocket>before;const detail=insured?`已配置 ${matching.map(k=>INSURANCE_TYPES[k].tag).join('、')}，遊戲模擬分攤 ${cash(reduction)}（80%）。`:'沒有符合本次事件的模擬保障，需自行負擔全部費用。';addHistory(e.title,`${detail}自付 ${cash(Math.min(before,outOfPocket))}。`,true);state.pending={kind:'risk',title:e.title,detail,knowledge:e.knowledge,insured,exhausted,outOfPocket,reduction};state.screen='knowledge';render();}
function resultPage(){const p=state.pending;return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">DECISION RESULT</div><h2>${escapeHtml(p.title)}</h2><p class="sub">你的選擇：${escapeHtml(p.choice)}</p><div class="note">${escapeHtml(p.tip)}</div>${btn(icon('arrow')+' 繼續人生旅程','continue',true)}</div></section><aside class="panel"><h2>日常選擇，也會改變人生</h2><p class="sub">幸福與健康不是保險的替代品；保險則是協助管理特定財務風險的工具。</p>${p.knowledge?knowledgeCard(p.knowledge):''}</aside></div>`;}
function knowledgePage(){const p=state.pending;const keys=p.kind==='purchase'?p.keys:[p.knowledge];return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">NS100 / INSURANCE KNOWLEDGE</div><h2>${p.kind==='purchase'?'保障規劃完成':p.insured?'模擬保障啟動':'發現保障缺口'}</h2><p class="sub">${p.kind==='purchase'?`本次配置 ${keys.map(k=>INSURANCE_TYPES[k].tag).join('、')}，模擬支出 ${cash(p.amount)}。`:escapeHtml(p.detail)}</p>${p.exhausted?'<div class="note warn">存款歸零、靠社會安全網與親友支援度過難關。這是教學情境，實際可用資源與資格依制度而定。</div>':''}${p.kind==='risk'?`<div class="note">本次模擬自付 ${cash(p.outOfPocket)}，模擬保障分攤 ${cash(p.reduction)}。80% 是教學假設，不是保險理賠承諾。</div>`:''}${btn(icon('arrow')+' 繼續人生旅程','continue',true)}</div></section><aside class="panel"><h2>白話保障知識卡</h2>${keys.map(knowledgeCard).join('')}</aside></div>`;}
function continueGame(){postTurn();}
function finish(){state.screen='report';state.pending=null;render();}
function report(){const moments=state.history.filter(h=>h.important).slice(-3);const missing=Object.keys(INSURANCE_TYPES).filter(k=>!state.cover.includes(k));const healthLabel=state.health>=75?'健康維持良好':state.health>=45?'健康需要持續照顧':'健康需要優先關注';const joyLabel=state.joy>=75?'幸福感充足':state.joy>=45?'幸福感穩定':'需要更多支持與休息';return `<h1 class="lead">百歲人生實驗報告</h1><div class="layout"><section><div class="panel report"><div class="step">NS100 / PERSONAL LIFE REPORT</div><div class="report-hero">${fairy()}<div><h2>${escapeHtml(state.name)}</h2><div class="muted">旅伴：${spiritName()} · ${state.career.title}</div><p class="sub">${state.age>=100?'你完成了百歲旅程。':`本次旅程在 ${state.age} 歲提前結束：${escapeHtml(state.deathReason||'不可預期的健康危機')}。`}</p></div></div><div class="result-numbers"><div><strong>${state.age} 歲</strong><small>最終年齡</small></div><div><strong>${state.health}</strong><small>健康指數</small></div><div><strong>${state.joy}</strong><small>幸福指數</small></div></div><div class="note">${healthLabel}；${joyLabel}。最終存款 ${cash(state.money)}。</div><h3>三個關鍵轉折點</h3><p class="muted">本局經歷 ${state.pressures} 次高壓抉擇。模擬結局不代表真實個人壽命。</p><div class="history">${(moments.length?moments:state.history.slice(-3)).map(h=>`<article><b>${h.age} 歲｜${escapeHtml(h.title)}</b><p>${escapeHtml(h.desc)}</p></article>`).join('')||'<p>這次旅程沒有留下事件紀錄。</p>'}</div><h3>保障缺口健檢</h3><p class="sub">已配置 ${state.cover.length} / 7 類。${missing.length?`尚未配置：${missing.map(k=>INSURANCE_TYPES[k].tag).join('、')}。請依家庭責任、工作型態、旅行習慣與負擔能力排序，不代表每類都必須購買。`:'七類教學保障均已配置，仍須留意實際契約條款、保額及除外責任。'}</p>${btn(icon('refresh')+' 重新模擬人生','restart',true)}</div></section><aside class="panel"><h2>七大保險分類總覽與推薦圖鑑</h2><p class="muted">可逐項展開；標記本次旅程的保障配置狀態。</p>${book()}</aside></div>`;}
function render(){const app=$('app');if(!app)return;const screen=state.screen;app.innerHTML=screen==='create'?creation():screen==='board'||screen==='rolling'?board():screen==='plan'?plan():screen==='event'?eventPage():screen==='result'?resultPage():screen==='knowledge'?knowledgePage():report();if(screen==='rolling'){const b=app.querySelector('[data-action="roll"]');if(b){b.disabled=true;b.innerHTML=`<span class="rolling">${icon('dice')}</span> 正在推進 ${state.roll+5} 歲…`;}}}
$('app').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled||locked)return;const [action,arg]=b.dataset.action.split(':');if(action==='spirit')answerSpirit(Number(arg));else if(action==='spiritBack'){state.answers.pop();render();}else if(action==='spiritReset'){state.answers=[];render();}else if(action==='mbti'){const n=$('player-name');if(n)state.name=n.value;state.mbti=arg;render();}else if(action==='start')start();else if(action==='roll')roll();else if(action==='plan')buyPlan(Number(arg));else if(action==='skipPlan')skipPlan();else if(action==='daily')dailyChoice(Number(arg));else if(action==='resolveRisk')resolveRisk();else if(action==='continue')continueGame();else if(action==='restart'){state={screen:'create',age:18,mbti:'INTJ',name:'',money:100000,health:85,joy:65,cover:[],career:null,turn:0,salaryBonus:0,history:[],planStops:[],pending:null,previous:null,notification:'',income:0,roll:0,stageAge:18,pressures:0,deathReason:'',lastMortality:0};render();}});
render();
</script></body></html>
