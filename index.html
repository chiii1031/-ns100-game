function start(){s={version:3,screen:'creator',q:0,answers:[],playerName:'',gender:'未指定',personality:'ENFJ',step:0,money:80000,health:90,joy:65,income:0,medical:false,accident:false,critical:false,care:false,history:[],events:[]};save();render()}

function reset(){if(confirm('確定重新開始？目前紀錄將被覆蓋。'))start()}
function report(){let txt='NS100 百歲人生模擬報告\n角色：'+s.playerName+'（'+s.gender+'）\\n人格偏好：'+s.personality+'（遊戲角色設定）\n模擬資產：'+money(s.money)+'\n健康：'+s.health+'/100\n幸福：'+s.joy+'/100\n保障：'+[['medical','醫療'],['accident','意外'],['critical','重疾'],['care','長照']].filter(x=>s[x[0]]).map(x=>x[1]).join('、')+'\n\n人生選擇：\n'+s.history.map(x=>x.age+'歲：'+x.choice).join('\n')+'\n\n風險事件：\n'+s.events.map(x=>x.age+'歲 '+x.name+'；模擬支出 '+money(x.cost)+'；模擬保障減免 '+money(x.benefit)).join('\n')+'\n\n本報告僅供教育展示，非實際保險商品資訊。';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='NS100_人生報告.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){let h='';if(s.screen==='home'){h='<div class="landing" role="img" aria-label="夕陽下，一個人沿著通往遠方的道路行走，象徵從零歲到百歲的人生旅程"><div class="sun"></div><div class="hill"></div><div class="hill two"></div><div class="road"></div><div class="walker"><div class="head"></div><div class="torso"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div><div class="sign">走向 100 歲</div><div class="landmark">LIFE IS A JOURNEY</div><div class="age-chip">0 歲 ━━━━━━━━━ 100 歲</div></div><h1 class="hero">如果人生可以<br><span style="color:#6ce7d3">先玩一次？</span></h1><p>從出生的那一刻開始，先由父母替你做選擇；長大後，再由你決定人生方向。一路走到 100 歲，體驗保障、財務與健康的交會。</p><div class="card"><h2>你的百歲人生，由你決定</h2><p>命名角色與選擇 MBTI → 0 歲父母決策 → 成長與人生抉擇 → 百歲報告</p>'+btn('開始我的百歲人生 →','start()','primary')+(localStorage.getItem('ns100_save')?btn('繼續上次的旅程','resume()'):'')+'</div><p class="muted">約 5–8 分鐘｜手機與電腦皆可玩｜無須登入</p>'}
if(s.screen==='creator'){let t=archetypes.find(x=>x[0]===s.personality);h='<div class="pill">角色創建 · STEP 1 / 1</div><h1 class="hero">打造你的<br><span style="color:#6ce7d3">人生主角</span></h1><div class="card"><h2>角色名稱</h2><p>替自己取一個名字，之後會出現在人生旅程和結算報告。</p><input class="creator-input" id="player-name" maxlength="16" placeholder="例如：小恩、人生冒險家" value="'+safe(s.playerName)+'" oninput="s.playerName=this.value;save()"><h2 style="margin-top:24px">選擇性別</h2><div class="gender-row">'+['女性','男性','不指定'].map(g=>'<button class="btn '+(s.gender===g?'primary':'')+'" onclick="selectGender(\''+g+'\')">'+g+'</button>').join('')+'</div><h2 style="margin-top:24px">選擇 MBTI 人格職業</h2><p>16 種人格各有一個遊戲稱號與起始加成。點選即可預覽。</p><div class="creator-grid">'+archetypes.map(t=>'<button class="type-option '+(s.personality===t[0]?'active':'')+'" onclick="selectType(\''+t[0]+'\')"><b>'+t[0]+'</b><span>'+t[1]+'</span></button>').join('')+'</div><div class="type-preview"><div class="avatar">'+(s.gender==='女性'?'👩':s.gender==='男性'?'👨':'🧑')+'</div><h2>'+t[0]+'｜'+t[1]+'</h2><p>'+t[2]+'</p><div class="bonus">✦ 天賦加成：'+t[5]+'</div><p class="muted">這是為遊戲平衡設計的虛構屬性，不代表人格類型能預測財富、健康或人生表現。</p></div>'+btn('確認角色，從 0 歲開始 →','confirmCharacter()','primary')+'</div>'}if(s.screen==='quiz'){let q=questions[s.q];h='<div class="pill">人格探索 '+(s.q+1)+' / 4</div><div class="bar"><span style="width:'+s.q/4*100+'%"></span></div><div class="card"><h2>'+q[0]+'</h2><p>選擇最接近自己的答案，沒有對錯。</p>'+q[1].map((x,i)=>btn(x,'answer('+i+')')).join('')+'</div><p class="muted">這是啟發式偏好探索，不是經過心理計量驗證的 MBTI 測驗。</p>'}
if(s.screen==='game'){let p=phases[s.step];h='<div class="pill">'+(p.age<18?'家庭代為決策 · ':'自己的人生 · ')+'第 '+(s.step+1)+' / '+phases.length+' 站</div><div class="pill">人格偏好 '+s.personality+'</div><div class="bar"><span style="width:'+s.step/phases.length*100+'%"></span></div><h1 class="hero">'+p.age+' 歲</h1>'+stat()+'<div class="card"><h2>'+p.title+'</h2><p>'+p.intro+'</p><h3>你會怎麼選？</h3>'+p.choices.map((c,i)=>'<button class="btn choice" onclick="pick('+i+')"><strong>'+c[0]+'</strong><small>'+c[1]+'</small></button>').join('')+'</div><div class="card"><h3>目前保障配置</h3>'+cover()+'</div>'}
if(s.screen==='risk'){let r=s.risk;h='<div class="pill">'+safe(s.playerName)+' · 人生風險事件</div><h1 class="hero">意外不會<br>先打招呼。</h1>'+stat()+'<div class="card"><h2>'+r.name+'</h2><p>'+r.desc+'</p><div class="stat">模擬事件支出 <b>'+money(r.cost)+'</b></div><div class="stat" style="margin-top:10px">模擬保障減免 <b>'+money(r.benefit)+'</b></div><p>這次你實際承擔的模擬支出：<strong>'+money(r.cost-r.benefit)+'</strong></p><div class="note">保障知識卡：'+r.tip+'</div>'+btn('繼續人生旅程 →','next()','primary')+'</div>'}
if(s.screen==='end'){let missing=[['medical','醫療'],['accident','意外'],['critical','重大疾病'],['care','長照']].filter(x=>!s[x[0]]).map(x=>x[1]);h='<div class="pill">'+safe(s.playerName)+' 的百歲人生完成</div><h1 class="hero">你的人生，<br><span style="color:#6ce7d3">不只有一種答案。</span></h1>'+stat()+'<div class="card"><h2>你的百歲人生報告</h2><p>角色：<strong>'+safe(s.playerName)+'（'+safe(s.gender)+'）</strong></p><p>人格偏好：<strong>'+s.personality+'</strong>（僅為遊戲探索）</p><h3>你做過的選擇</h3><div class="timeline">'+s.history.map(x=>'<div><b>'+x.age+' 歲</b>｜'+x.choice+'</div>').join('')+'</div><h3>經歷的風險</h3><div class="timeline">'+(s.events.length?s.events.map(x=>'<div><b>'+x.age+' 歲｜'+x.name+'</b><p>模擬支出 '+money(x.cost)+'；保障減免 '+money(x.benefit)+'</p></div>').join(''):'<p>本次沒有觸發風險事件。</p>')+'</div><h3>保障檢視</h3>'+cover()+'<p>'+(missing.length?'尚未配置的模擬保障：'+missing.join('、'):'四類模擬保障均已配置。')+'</p><div class="note">人生並非只追求最高資產。健康、幸福、家庭支持與保障配置，都可能影響面對風險時的選擇。</div>'+btn('儲存人生報告（文字檔）','report()','primary')+btn('列印／儲存 PDF','window.print()')+btn('重新開始另一段人生','reset()')+'</div>'}
$('app').innerHTML=h}
function resume(){try{let old=JSON.parse(localStorage.getItem('ns100_save'));if(old&&old.version===3&&old.screen&&old.money!==undefined){s=old;render()}else start()}catch(e){start()}}render();
</script></body></html>
