<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091827">
<title>NS100｜百歲人生模擬實驗室</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  color:#eaf5f5;
  background:#071521;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 85% 0,#17475a,transparent 45%),#071521;
}
button,input{font:inherit}
button{cursor:pointer}
main{
  width:min(1160px,100%);
  margin:auto;
  padding:22px clamp(14px,3vw,32px) 60px;
}
.brand{
  color:#76e9d4;
  font-size:12px;
  letter-spacing:.19em;
  font-weight:850;
  display:flex;
  align-items:center;
  gap:10px;
}
.brand:before{
  content:'';
  height:8px;
  width:8px;
  border-radius:50%;
  background:#7ce9d6;
  box-shadow:0 0 16px #7ce9d6;
}
.muted{color:#a8c5ce;font-size:13px}
.lead{
  font-size:clamp(28px,4.5vw,48px);
  line-height:1.18;
  letter-spacing:-.03em;
  margin:18px 0 10px;
}
.sub{line-height:1.75;color:#bfd5da;margin:6px 0 14px}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(330px,.9fr);
  gap:20px;
  align-items:start;
}
.panel{
  background:linear-gradient(155deg,#112c3b,#0d2333);
  border:1px solid #31576a;
  border-radius:22px;
  padding:22px;
  box-shadow:0 16px 45px #0003;
}
.panel h2{font-size:22px;margin:0 0 8px}
.panel h3{font-size:16px;margin:16px 0 8px;color:#d6f5ef}
.button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:13px 16px;
  background:#1a3d4d;
  border:1px solid #467383;
  color:#f3ffff;
  border-radius:13px;
  text-align:center;
  font-weight:650;
  margin:8px 0;
  transition:background .2s,transform .2s;
}
.button:hover{background:#28596a;transform:translateY(-1px)}
.button.primary{background:#6ce1ca;color:#082b33;border:0;font-weight:750}
.button.primary:hover{background:#8cf2df}
.button:disabled{opacity:.45;cursor:not-allowed}
.button svg{width:19px;height:19px;flex-shrink:0}

/* Stage & Walking Animation (Preserved V1 Visuals) */
.stage{
  position:relative;
  overflow:hidden;
  height:clamp(280px,32vw,390px);
  border-radius:23px;
  border:1px solid #457382;
  background:linear-gradient(180deg,#12364e 0%,#215768 58%,#163d49 100%);
  isolation:isolate;
  transition:background 1.5s;
}
.stage.era-family{background:linear-gradient(180deg,#234760,#54817e 58%,#28564f 100%)}
.stage.era-park{background:linear-gradient(180deg,#304a66,#648c80 58%,#2c6258 100%)}
.sun{
  position:absolute;width:110px;height:110px;top:32px;right:12%;
  border-radius:50%;background:#ffe1a1;box-shadow:0 0 60px #f8cd8790;
}
.hill{
  position:absolute;bottom:66px;width:125%;left:-10%;height:142px;
  background:#225a5b;border-radius:55% 55% 0 0;transform:rotate(-7deg);
  transition:background 1.4s;
}
.hill.two{bottom:40px;left:35%;background:#2c6b64;transform:rotate(12deg)}
.era-family .hill{background:#416d68}
.era-park .hill{background:#367767}
.road{
  position:absolute;bottom:-145px;left:50%;width:210px;height:415px;
  background:#c4d9c8;
  transform:translateX(-50%) perspective(250px) rotateX(34deg);
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  border-radius:50% 50% 0 0;
}
.road:after{
  content:'';position:absolute;left:49%;top:15%;height:75%;width:3px;
  background:repeating-linear-gradient(to bottom,#fff 0 22px,transparent 22px 45px);
  animation:roadMove 1.6s linear infinite;
}
.walker{
  position:absolute;bottom:77px;left:50%;width:82px;height:134px;
  transform:translateX(-50%);
  animation:walkBounce .65s ease-in-out infinite alternate;
  filter:drop-shadow(0 8px 6px #082b3345);
}
.walker svg{width:100%;height:100%;overflow:visible}
.walker .left-arm{transform-origin:28px 54px;animation:limb .8s infinite alternate}
.walker .right-arm{transform-origin:54px 54px;animation:limb .8s infinite alternate-reverse}
.walker .left-leg{transform-origin:34px 90px;animation:limb .8s infinite alternate-reverse}
.walker .right-leg{transform-origin:48px 90px;animation:limb .8s infinite alternate}
.landmark{position:absolute;top:18px;left:20px;font-size:12px;color:#d8fff0;letter-spacing:.12em;font-weight:800}
.age-chip{position:absolute;bottom:16px;left:17px;font-size:13px;font-weight:750;color:#e6fff4}
.stage-sign{
  position:absolute;bottom:120px;right:10%;background:#f5eccc;color:#204750;
  padding:8px 12px;border-radius:7px;font-size:12px;font-weight:800;transform:rotate(5deg);
}
.stage-sign:after{content:'';position:absolute;top:100%;left:48%;height:38px;width:5px;background:#f5eccc}
.scenery{position:absolute;bottom:90px;left:5%;display:flex;gap:16px;align-items:end;opacity:.85;transition:opacity 1s}
.building{width:27px;height:var(--h);background:#183e50;border-radius:4px 4px 0 0;border-top:4px solid #4d8190}
.era-park .building{background:#2e695e;border-radius:50% 50% 4px 4px;border:0;width:37px}
.era-park .building:after{content:'';display:block;width:6px;height:28px;background:#31544c;margin:40px auto 0}
.era-family .building{background:#5c7770}

/* HUD & Stats */
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.career-badge{
  background:#163d4c;border:1px solid #487d8c;color:#9ef2df;
  padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;
}
.progress{height:7px;border-radius:10px;background:#254455;overflow:hidden}
.progress span{height:100%;display:block;background:linear-gradient(90deg,#6be0ca,#f2d49a);transition:width .8s}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}
.stat{padding:11px 10px;border:1px solid #2a4d5d;background:#0e2533;border-radius:14px;min-width:0}
.stat-head{display:flex;align-items:center;gap:6px;color:#aecbd0;font-size:11px}
.stat-head svg{width:15px;height:15px;color:#76e3d1}
.stat strong{display:block;font-size:clamp(14px,1.6vw,18px);white-space:nowrap;margin:5px 0 7px;letter-spacing:-.02em}
.stat .progress{height:5px}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;border:1px solid #3e7775;background:#163c44;
  border-radius:30px;padding:5px 11px;color:#a6f1df;
}
.tag.empty{border-color:#3d5662;color:#b3c9d0;background:#152b39}
.step{font-size:11px;font-weight:800;color:#7fe8d5;letter-spacing:.12em;margin-bottom:8px}

/* Options & Notes */
.options{display:grid;gap:9px}
.option{
  width:100%;border:1px solid #3b6574;background:#163748;color:#ecf9f8;
  padding:13px 15px;border-radius:13px;text-align:left;transition:background .2s,border-color .2s;
}
.option:hover{background:#245467;border-color:#6ce1ca}
.option:disabled{opacity:.45;cursor:not-allowed}
.option b{display:block;font-size:15px}
.option small{display:block;font-size:12px;color:#b3ced3;margin-top:4px;line-height:1.55}
.note{
  border-left:3px solid #6be1ca;background:#183b46;
  padding:13px 15px;border-radius:9px;line-height:1.7;color:#d5eeee;font-size:13.5px;
}
.note.warn{border-left-color:#f2b872;background:#2b3540}
.input{
  display:block;width:100%;background:#0c2635;border:1px solid #477384;
  border-radius:12px;padding:12px 14px;color:white;
}

/* 16 MBTI Grid */
.mbti-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-top:8px;
}
.mbti-btn{
  padding:9px 6px;
  border:1px solid #385e6d;
  background:#112f40;
  color:#efffff;
  border-radius:11px;
  text-align:center;
  transition:all .15s;
}
.mbti-btn:hover{background:#1b455a}
.mbti-btn.selected{border:2px solid #7ce7d1;background:#215262;box-shadow:0 0 12px #7ce7d133}
.mbti-btn b{display:block;font-size:14px;letter-spacing:.04em}
.mbti-btn span{display:block;font-size:11px;color:#b8d2d7;margin-top:2px}
.mbti-preview{
  display:flex;align-items:center;gap:14px;
  background:#133344;border:1px solid #3a6878;border-radius:14px;
  padding:12px 14px;margin:12px 0;
}
.mbti-preview svg{width:64px;height:86px;flex-shrink:0}

/* Knowledge Cards & Guide */
.divider{height:1px;background:#315365;margin:16px 0}
.change{color:#8bf1dc;font-size:13px;font-weight:700}
.history{border-left:2px solid #447d80;margin:14px 0 14px 8px;padding-left:18px}
.history article{margin:0 0 14px}
.history b{font-size:14px}
.history p{margin:3px 0;color:#bcd0d5;font-size:13px}
.report{background:linear-gradient(145deg,#1a4650,#102a3c);border:1px solid #77b6ab}
.report-hero{display:flex;align-items:center;gap:16px}
.report-hero svg{width:88px;height:114px;flex-shrink:0}
.report-hero h2{margin:0}
.result-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.result-numbers div{background:#0d2b38;border-radius:12px;padding:10px;text-align:center}
.result-numbers strong{display:block;font-size:20px}
.result-numbers small{color:#b8d0d4}

/* Rich Knowledge Card Styling */
.k-card{
  background:#133242;border:1px solid #427585;border-radius:14px;
  padding:14px 16px;margin:10px 0;
}
.k-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.k-badge{background:#235766;color:#9cf3e0;font-size:11px;font-weight:750;padding:3px 9px;border-radius:20px}
.k-grid{display:grid;gap:6px;font-size:13px;color:#cde3e6;line-height:1.6}
.k-row b{color:#8beedd}
.knowledge-list{display:grid;gap:10px}
.knowledge-list details{border:1px solid #3d6571;border-radius:12px;padding:12px 14px;background:#153645}
.knowledge-list summary{cursor:pointer;font-weight:750;display:flex;align-items:center;gap:8px;color:#eafffc}
.knowledge-list details[open] summary{margin-bottom:8px;color:#7fe8d5}
.foot{font-size:11px;color:#9bb7c1;line-height:1.7;margin-top:24px}

@keyframes limb{from{transform:rotate(-19deg)}to{transform:rotate(22deg)}}
@keyframes walkBounce{to{transform:translate(-50%,-4px)}}
@keyframes roadMove{to{background-position:0 45px}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}
.rolling{animation:shake .16s linear infinite;display:inline-flex}

@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .stage{height:310px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:460px){
  .mbti-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.mbti-btn{padding:8px 2px}.mbti-btn span{font-size:9px}
}
.fairy-art{width:180px;max-width:100%;height:auto;filter:drop-shadow(0 0 10px #b8e9dd44)}.stage .fairy-art{width:70px;animation:fairyFloat 3s ease-in-out infinite}@keyframes fairyFloat{50%{transform:translateY(-6px)}}.gender-choice{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 18px}.gender-choice label{padding:12px 20px;border:1px solid #41697a;border-radius:12px;cursor:pointer}.gender-choice input{accent-color:#76e9d4}.gender-choice label:has(input:checked){border-color:#76e9d4;background:#17475a}.wheel-wrap{position:relative;width:260px;height:260px;margin:24px auto}.career-wheel{position:relative;width:100%;height:100%;border-radius:50%;border:5px solid #d9c68b;background:conic-gradient(from -30deg,#245d70 0deg 60deg,#795c85 60deg 120deg,#346e62 120deg 180deg,#805c43 180deg 240deg,#415c8c 240deg 300deg,#8b5969 300deg 360deg);transition:transform 3s cubic-bezier(.12,.7,.12,1);box-shadow:0 0 24px #76e9d433}.career-wheel span{position:absolute;left:50%;top:50%;width:76px;margin-left:-38px;margin-top:-10px;font-size:13px;font-weight:800;color:white;text-shadow:0 1px 3px #000}.wheel-pointer{position:absolute;z-index:2;left:calc(50% - 12px);top:-8px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:26px solid #ffe3a1}.career-wheel:after{content:'';position:absolute;inset:44%;border-radius:50%;background:#d9c68b;border:3px solid #fff2c5}.home-cover{text-align:center;max-width:780px;margin:28px auto;padding:36px 20px;border:1px solid #31576a;border-radius:28px;background:radial-gradient(ellipse at top,#214e60,#0b2030 70%)}.home-cover h1{font-size:clamp(42px,8vw,76px);line-height:1.1;margin:18px 0;color:#e9f9f4}.home-cover h2{font-size:clamp(18px,3vw,25px);color:#f5d79a}.home-cover p{line-height:1.8;max-width:560px;margin:16px auto}.cover-art svg{width:100%;max-width:640px;border-radius:18px}.cover-motto{color:#9be5d6;font-weight:700}.wheel-wrap{width:290px;height:290px;max-width:100%}.career-wheel{background:conic-gradient(from -15deg,#245d70 0deg 30deg,#795c85 30deg 60deg,#346e62 60deg 90deg,#805c43 90deg 120deg,#415c8c 120deg 150deg,#8b5969 150deg 180deg,#245d70 180deg 210deg,#795c85 210deg 240deg,#346e62 240deg 270deg,#805c43 270deg 300deg,#415c8c 300deg 330deg,#8b5969 330deg 360deg)}.career-wheel span{font-size:11px}.dice-overlay{position:fixed;inset:0;z-index:999;background:#06121bd9;display:grid;place-items:center;padding:20px}.dice-panel{text-align:center;width:min(360px,100%)}.die-face{width:120px;height:120px;margin:22px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:17px;border-radius:22px;background:#f7f2e5;box-shadow:0 8px 0 #b9b4a7,0 0 28px #b5f5e84d}.die-face i{border-radius:50%}.die-face .pip{background:#173849}.die-shake{animation:diceShake .18s infinite alternate}@keyframes diceShake{from{transform:rotate(-14deg) translateY(-8px)}to{transform:rotate(14deg) translateY(3px)}}.chance-card{text-align:center;max-width:620px;margin:35px auto;border-color:#d9c68b;background:radial-gradient(ellipse at top,#66532f,#102b39 70%)}.chance-star{font-size:72px;color:#ffe3a1;text-shadow:0 0 25px #ffe3a1;animation:chanceGlow 1.6s ease-in-out infinite alternate}@keyframes chanceGlow{to{transform:scale(1.12);opacity:.8}}.companion-panel{margin-top:16px;padding:18px;border:1px solid #bca36b;border-radius:18px;background:#173747}.companion-head{display:flex;align-items:center;gap:12px}.companion-head .fairy-art{width:85px}.companion-head progress{accent-color:#d9c68b;width:100%}</style>
</head>
<body>
<main>
  <div class="brand">NS100 / LIFE SIMULATION LAB <span style="margin-left:auto;color:#a6c5c9;letter-spacing:0;font-weight:500">FINAL DEMO · 18—100</span></div>
  <div id="app"></div>
  <div class="foot">NS100 提案競賽教學展示原型。所有職業薪資、生活開銷、風險機率與保障減免比例均為互動教學模擬數值，旨在協助年輕族群認識常見保險分類與人生風險規劃，非實際保險商品條款或理賠承諾。</div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (n, a=0, b=100) => Math.max(a, Math.min(b, n));
const cash = n => 'NT$ ' + Math.round(n).toLocaleString('zh-TW');

const ICON = {
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
  heart:'<path d="M20.8 8.5c0 4.7-8.8 10.5-8.8 10.5S3.2 13.2 3.2 8.5a4.7 4.7 0 0 1 8.8-2.1 4.7 4.7 0 0 1 8.8 2.1Z"/>',
  spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>',
  shield:'<path d="M12 2 4 5v6c0 5 3 8 8 11 5-3 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/>',
  dice:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="12" cy="12" r="1"/>',
  arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',
  book:'<path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/>',
  refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  check:'<path d="m4 12 5 5L20 6"/>'
};
const icon = (name, size=18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.spark}</svg>`;

/* 16 MBTI Profiles with distinct visual traits & balanced starting perks */
const MBTI_DATA = {
  INTJ:{title:'建築師',group:'NT',coat:'#3b6e8c',accent:'#f0c985',hair:'#1e293b',prop:'laptop',desc:'習慣提前布局的策略家，喜歡把未來算得清清楚楚。',perk:'初始存款 +15,000'},
  INTP:{title:'邏輯學家',group:'NT',coat:'#497f96',accent:'#93e2d5',hair:'#283849',prop:'headphones',desc:'對世界充滿好奇的思考者，總在尋找最合理的解法。',perk:'初始存款 +12,000'},
  ENTJ:{title:'指揮官',group:'NT',coat:'#2f5d7c',accent:'#f5b971',hair:'#1c2536',prop:'briefcase',desc:'果斷行動的領導者，面對人生轉折總是正面迎擊。',perk:'初始年薪加成 +5,000'},
  ENTP:{title:'辯論家',group:'NT',coat:'#5289a1',accent:'#ffd180',hair:'#334155',prop:'coffee',desc:'點子滿滿的創新者，喜歡嘗試各種新鮮的人生體驗。',perk:'初始幸福 +8'},

  INFJ:{title:'提倡者',group:'NF',coat:'#5b8c7a',accent:'#f3d59b',hair:'#2b3633',prop:'book',desc:'溫柔而堅定的理想家，重視內心平靜與長遠意義。',perk:'初始健康 +6、幸福 +4'},
  INFP:{title:'調停者',group:'NF',coat:'#d69a70',accent:'#83d7c3',hair:'#3d2f2a',prop:'headphones',desc:'感性細膩的夢想家，在日常小確幸中累積生活能量。',perk:'初始幸福 +10'},
  ENFJ:{title:'主人公',group:'NF',coat:'#4d8b7b',accent:'#f7c588',hair:'#26332f',prop:'coffee',desc:'溫暖有感染力的夥伴，總把家人與朋友放在心上。',perk:'初始幸福 +8'},
  ENFP:{title:'競選者',group:'NF',coat:'#df8c68',accent:'#94e8d6',hair:'#3b2c27',prop:'camera',desc:'熱情洋溢的自由靈魂，把每一歲都活成一場冒險。',perk:'初始幸福 +10'},

  ISTJ:{title:'物流師',group:'SJ',coat:'#557a8a',accent:'#e6cfa3',hair:'#1f2937',prop:'briefcase',desc:'務實可靠的執行者，一步一腳印累積穩健的安全網。',perk:'初始存款 +15,000'},
  ISFJ:{title:'守衛者',group:'SJ',coat:'#739e8b',accent:'#f0d69c',hair:'#2d3735',prop:'bag',desc:'細心體貼的照顧者，總是默默為身邊的人遮風擋雨。',perk:'初始健康 +8'},
  ESTJ:{title:'總經理',group:'SJ',coat:'#436b7d',accent:'#eab676',hair:'#1e293b',prop:'laptop',desc:'講求效率的管理者，讓工作、健康與財務井然有序。',perk:'初始年薪加成 +5,000'},

function pressureEvent(){const pool=PRESSURES.filter(x=>x.min<=state.age&&x.max>=state.age);const fresh=pool.filter(e=>!state.history.some(h=>h.title===e.title));const e=state.pressures===0?PRESSURES[0]:rand(fresh.length?fresh:pool);state.pending={...e,pressure:true,risk:false};state.screen='event';state.pressures++;}
function lifeDecay(from,to){for(let a=from;a<to;a++){if(a>=30)state.health=clamp(state.health-(a<50?.42:a<65?.72:a<80?1.05:1.35));state.joy=clamp(state.joy+(state.joy>55?-.65:state.joy<35?.18:-.15));}state.health=+state.health.toFixed(1);state.joy=+state.joy.toFixed(1);}
function mortalityCheck(){if(state.age>=100)return false;const healthFactor=state.health<20?1.75:state.health<40?1.3:state.health>70?.76:1;const oldOdds=Math.min(.75,mortalityBase(state.age)*healthFactor*.66);const odds=1-Math.pow(1-oldOdds,(state.roll||3.5)/8.5);state.lastMortality=odds;if(Math.random()<odds){state.deathReason=state.health<30?'長期健康衰退與突發併發症':'人生後期的不可預期健康危機';addHistory('生命旅程提前落幕',`在 ${state.age} 歲遭遇健康危機。此為模擬機率事件，不是個人壽命預測。`,true);finish();return true;}return false;}

function isAffordable(amount){return amount<=0||amount<=Math.max(0,Math.min(Math.floor(state.money*.6),state.money-5000));}
function applyChoice(c){if(c.cost&&!isAffordable(c.cost))return false;spend(c.cost||0);state.money+=c.gain||0;state.health=clamp(state.health+(c.health||0));state.joy=clamp(state.joy+(c.joy||0));state.salaryBonus+=c.salaryBonus||0;return true;}
function incomeForYears(from,to){let sum=0;const career=state.career;for(let age=from;age<to;age++){if(age<22&&state.careerMode!=='custom'){sum+=3000;continue;}if(age<65){const exp=Math.max(0,age-Math.max(state.startAge||18,state.careerMode==='custom'?18:22));const gross=(career.basePay+career.growth*exp)*12;const saveRate=age<30?.045:age<45?.095:age<55?.115:.09;sum+=Math.round(gross*saveRate)+state.salaryBonus-(age>=35&&age<55?22000:0);}else{sum-=age<80?44000:85000;}}const payment=Math.min(state.studentLoan||0,Math.max(0,to-Math.max(from,22))*24000,Math.max(0,Math.floor(sum*.35)));state.studentLoan-=payment;return Math.round(sum-payment);}

function customCareerPage(){const avg=Math.round(CAREERS.reduce((a,c)=>a+c.basePay,0)/CAREERS.length);return `<h1 class="lead">自訂真實人生</h1><div class="panel" style="max-width:720px;margin:auto"><label for="custom-job">你的職業</label><input class="input" id="custom-job" maxlength="40" placeholder="例如：教師、工程師、自由工作者"><label for="custom-pay">每月收入（新臺幣）</label><input class="input" id="custom-pay" type="number" min="0" max="10000000" step="1" placeholder="輸入月收入，或留空使用參考值"><p class="sub">不知道收入？留空即可。系統優先比對內建職業，無法比對時使用十二種遊戲職業的平均起薪 ${cash(avg)}。這不是官方職業平均薪資。</p><p id="custom-error" role="alert"></p>${btn('確認職業並開始人生','saveCustom',true)}${btn('返回選擇','careerBack')}</div>`;}
function saveCustom(){const title=$('custom-job').value.trim(),raw=$('custom-pay').value.trim(),n=Number(raw);if(!title||$('custom-pay').validity.badInput||(raw&&(!Number.isSafeInteger(n)||n<0||n>10000000))){$('custom-error').textContent='請輸入職業及有效的非負整數月收入。';return;}const aliases=[/行銷|企劃/,/軟體|程式|資訊工程/,/護理|醫事/,/設計|接案/,/金融|銀行|營運/,/公務|教育行政|教師|老師/,/餐飲|廚師|服務生/,/物流|配送|外送/,/機械|技術員/,/零售|門市|店員/,/社工/,/研究助理/];const idx=aliases.findIndex(x=>x.test(title));const ref=CAREERS[idx];const avg=Math.round(CAREERS.reduce((a,c)=>a+c.basePay,0)/CAREERS.length);state.career={title,basePay:raw?n:ref?ref.basePay:avg,growth:ref?ref.growth:Math.round(CAREERS.reduce((a,c)=>a+c.growth,0)/CAREERS.length),desc:'自訂職業；薪資成長為遊戲模擬設定。'};beginLife();}
function careerPage(){if(!state.careerMode)return `<h1 class="lead">選擇你的人生起點</h1><div class="panel"><div class="options">${btn("命運職業輪盤｜隨機體驗","careerRandom",true)}${btn("自訂真實人生｜輸入職業與月收入","careerCustom")}</div></div>`;if(state.careerMode==="custom")return customCareerPage();return `<h1 class="lead">命運職業輪盤</h1><p class="sub">${escapeHtml(state.name)}，轉動輪盤，揭曉你的第一份職業與起始薪水。</p><div class="panel" style="max-width:720px;margin:auto;text-align:center"><div class="wheel-wrap"><div class="wheel-pointer"></div><div id="career-wheel" class="career-wheel" style="transform:rotate(${state.wheelAngle||0}deg)">${WHEEL_LABELS.map((v,i)=>`<span style="transform:rotate(${i*30}deg) translateY(-105px) rotate(90deg)">${v}</span>`).join('')}</div></div><div id="career-result" aria-live="polite">${state.career?`<h2>${state.career.title}</h2><p>起始月薪 <strong>${cash(state.career.basePay)}</strong>｜每年調薪 ${cash(state.career.growth)}</p><p class="sub">${state.career.desc}</p>`:'<p class="sub">十二種職業等機率抽出，每局只能抽一次。</p>'}</div>${state.career?btn('開啟百歲人生','beginLife',true):btn('轉動輪盤','spinCareer',true)}<p class="muted">薪資及調薪均為遊戲模擬值，原有收入結算規則不變。</p></div>`;}
function spinCareer(){if(locked||state.career||state.screen!=='career')return;locked=true;const i=Math.floor(Math.random()*CAREERS.length);state.wheelAngle=1800-i*30;const w=$('career-wheel');w.style.transform='rotate('+state.wheelAngle+'deg)';const b=document.querySelector('[data-action="spinCareer"]');b.disabled=true;b.textContent='輪盤轉動中…';setTimeout(()=>{state.career=CAREERS[i];locked=false;render();},3100);}
function board(){return `<h1 class="lead">${escapeHtml(state.name)} 的人生道路</h1><div class="stage-top"><span class="muted">${state.playerGender==="female"?"女":state.playerGender==="male"?"男":"不想透露性別"}玩家 · 旅伴：${spiritName()}</span><span class="career-badge">${state.age<65?state.career.title:'退休生活'}</span></div><div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">SURVIVAL MODE · ROUND ${state.turn+1} · 高壓抉擇 ${state.pressures} 次</div><h2>下一段人生，會發生什麼？</h2><p class="sub">擲出 1～6 點，向前走點數（1～6 歲）。每次結算工作與生活淨收支、自然健康衰退，再隨機遇見 1～3 個人生事件。部分回合有高壓事件，百歲前也可能提前結束。</p>${btn(icon('dice')+' 推進人生（擲骰子）','roll',true)}${state.notification?`<div class="note">${escapeHtml(state.notification)}</div>`:''}</div></section><aside class="panel"><div class="step">CAREER & FINANCE</div><h2>工作與收入</h2><p class="sub">剩餘學貸 ${cash(state.studentLoan||0)}｜22 歲起依正淨收入還款，每年最多 24,000 元（無息模擬）。</p><p class="sub">${state.career.title}｜起薪 ${cash(state.career.basePay)}／月｜每年調薪 ${cash(state.career.growth)}／月</p><div class="note">最近一回合淨收支：${state.income<0?'-':''}${cash(Math.abs(state.income))}。淨儲蓄採模擬薪資的一定比例，已假設扣除日常生活支出；65 歲後改計模擬退休金。</div><h3>人生轉折紀錄</h3><div class="history">${state.history.slice(-4).reverse().map(h=>`<article><b>${h.age} 歲｜${escapeHtml(h.title)}</b><p>${escapeHtml(h.desc)}</p></article>`).join('')||'<p class="muted">尚無紀錄</p>'}</div></aside></div>`;}
function dieFace(n){const dots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};return '<div class="die-face">'+Array.from({length:9},(_,i)=>'<i class="'+(dots[n].includes(i)?'pip':'')+'"></i>').join('')+'</div>';}
function showDice(n,advance,done){const overlay=document.createElement('div');overlay.className='dice-overlay';overlay.innerHTML='<div class="panel dice-panel" role="status"><h2>命運骰子</h2><div id="die-visual" class="die-shake">'+dieFace(1)+'</div><h2 id="die-result">擲骰中…</h2><p id="die-detail">下一段人生即將揭曉</p></div>';document.body.appendChild(overlay);let t=0;const timer=setInterval(()=>{overlay.querySelector('#die-visual').innerHTML=dieFace(1+Math.floor(Math.random()*6));if(++t>=12){clearInterval(timer);const d=overlay.querySelector('#die-visual');d.classList.remove('die-shake');d.innerHTML=dieFace(n);overlay.querySelector('#die-result').textContent='骰出 '+n+' 點！';overlay.querySelector('#die-detail').textContent='前進 '+advance+' 歲';setTimeout(()=>{overlay.remove();done();},1500);}},100);}
function roll(){if(locked||state.screen!=='board')return;locked=true;state.roll=1+Math.floor(Math.random()*6);const from=state.age;const to=Math.min(100,from+state.roll);state.income=incomeForYears(from,to);if(state.turn<3)state.income=Math.max(state.income,-Math.max(0,state.money-10000));state.money=Math.max(Math.min(state.money,5000),state.money+state.income);lifeDecay(from,to);state.age=to;state.turn++;state.notification=`骰出 ${state.roll} 點，前進 ${to-from} 歲；本段淨收支 ${state.income<0?'-':''}${cash(Math.abs(state.income))}。`;showDice(state.roll,to-from,()=>{state.stageAge=to;locked=false;if(to>=25&&to<65&&!state.planStops.includes('early')){state.planStops.push('early');state.screen='plan';state.pending={plan:'early'};}else if(to>=35&&to<75&&!state.planStops.includes('middle')){state.planStops.push('middle');state.screen='plan';state.pending={plan:'middle'};}else{drawEvent();}render();});}
const CHANCE_EVENTS=[{min:18,max:100,title:'發票中獎',story:'整理電子發票時，發現有一張中了獎！',gain:1000},{min:18,max:100,title:'過年刮刮樂中獎',story:'親友送你的新年刮刮樂意外中了獎。',gain:5000},{min:18,max:100,title:'樂透意外中獎',story:'這段模擬人生中，一張先前取得的彩券帶來意外獎金。',gain:80000,rare:true},{min:22,max:64,title:'額外績效獎金',story:'你的努力受到肯定，收到一筆額外獎金。',gain:18000},{min:18,max:100,title:'抽獎活動的驚喜',story:'參加免費活動時，意外抽中現金獎。',gain:3000},{min:18,max:100,title:'二手物品找到新主人',story:'整理家中閒置物品，順利售出。',gain:4500},{min:18,max:100,title:'意外收到退款',story:'先前多繳的款項完成退費。',gain:6500},{min:22,max:64,title:'專案成果獎勵',story:'參與的專案獲得獎勵，分到一筆獎金。',gain:25000}];
function chancePage(){const e=state.chance;return `<div class="panel chance-card"><div class="step">CHANCE & FATE / 機會與命運</div><div class="chance-star">✦</div><h1>${escapeHtml(e.title)}</h1><p class="sub">${escapeHtml(e.story)}</p><h2 style="color:#f5d79a">+${cash(e.gain)}</h2><p>幸福 +5</p><p class="muted">這是遊戲隨機事件，不代表實際中獎機率或理財方式。</p>${btn('領取並繼續人生','claimChance',true)}</div>`;}
function claimChance(){if(state.screen!=='chance'||!state.chance)return;const e=state.chance;state.money+=e.gain;state.joy=clamp(state.joy+5);addHistory(e.title,'意外收入 '+cash(e.gain),true);state.chance=null;nextLifeEvent();}
function drawEvent(){state.eventQueue=[];const count=1+Math.floor(Math.random()*3);const used=new Set();const pick=(pool)=>{const eligible=pool.filter(e=>e.min<=state.age&&e.max>=state.age&&!used.has(e.title));const fresh=eligible.filter(e=>!state.history.some(h=>h.title===e.title));const e=rand(fresh.length?fresh:eligible);if(e)used.add(e.title);return e;};for(let i=0;i<count;i++){let e,kind='daily';if(i===0&&state.turn>=3&&pressureNeeded()){e=pick(PRESSURES);if(e){kind='pressure';state.pressures++;}}if(!e&&i>0&&state.turn>=3&&state.age>=25&&Math.random()<.25){e=pick(RISK_EVENTS);if(e)kind='risk';}if(!e&&i>0&&Math.random()<.15){e=pick(CHANCE_EVENTS.filter(x=>!x.rare||Math.random()<.08));if(e)kind='chance';}if(!e)e=pick(DAILY_EVENTS);if(e)state.eventQueue.push({e,kind});}if(state.turn-state.lastPlanTurn>=2&&state.cover.length<Object.keys(INSURANCE_TYPES).length&&Math.random()<.4){state.eventQueue.splice(Math.floor(Math.random()*(state.eventQueue.length+1)),0,{kind:'plan',e:{}});}state.eventTotal=state.eventQueue.length;nextLifeEvent();}
function nextLifeEvent(){state.adviceShown=false;const item=state.eventQueue.shift();if(!item){postTurn();return;}const {e,kind}=item;if(kind==='plan'){state.planQueued=true;state.lastPlanTurn=state.turn;state.pending={plan:'review'};state.screen='plan';}else if(kind==='chance'){state.chance=e;state.screen='chance';}else{state.pending={...e,risk:kind==='risk',pressure:kind==='pressure'};if(e.choices){const reserve=state.turn<=3?10000:0;const budget=Math.max(0,Math.min(Math.floor(state.money*.6),state.money-Math.max(5000,reserve)));state.pending.choices=e.choices.slice();if(!state.pending.choices.some(c=>(c.cost||0)<=budget))state.pending.choices.push({text:'暫緩支出，尋求其他資源',cost:0,joy:-3,health:0,tip:'保留基本生活資金。'});}state.screen='event';}render();}
function eventProgress(){return state.eventTotal&&['event','chance','result','knowledge'].includes(state.screen)&&state.pending?.kind!=='purchase'?'<div class="note">本回合事件 '+(state.eventTotal-state.eventQueue.length)+' / '+state.eventTotal+' · '+state.age+' 歲</div>':'';}
function plan(){const early=state.pending.plan==='early';return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">PROTECTION PLANNING</div><h2>${state.pending.plan==='review'?'旅伴提醒｜要不要補足目前的保障？':early?'第一站｜剛開始工作的保障規劃':'第二站｜家庭責任與進階保障'}</h2><p class="sub">你可以從有限預算中選擇一組保障。已配置的類別不會重複收費；這是一次性的遊戲預算，不代表實際保費。</p><div class="options">${PLANS.map((p,i)=>{const fresh=p.keys.filter(k=>!state.cover.includes(k));const price=Math.round(p.cost*fresh.length/p.keys.length);const dis=!fresh.length||!isAffordable(price);return `<button class="option" data-action="plan:${i}" ${dis?'disabled':''}><b>${p.title}</b><small>${p.desc}<br>本次模擬支出 ${cash(price)}${!fresh.length?' · 已全數配置':!isAffordable(price)?' · 目前存款不足':''}</small></button>`;}).join('')}</div>${btn('先保留現金，暫不投保','skipPlan')}</div></section><aside class="panel"><h2>七大保障，先認識再決定</h2><p class="muted">展開可看三個白話欄位。</p>${book()}</aside></div>`;}
function buyPlan(i){const p=PLANS[i];if(!p)return;const fresh=p.keys.filter(k=>!state.cover.includes(k));const price=Math.round(p.cost*fresh.length/p.keys.length);if(!fresh.length||!isAffordable(price))return;spend(price);state.cover.push(...fresh);state.pending={kind:'purchase',keys:fresh,amount:price};state.screen='knowledge';addHistory('完成保障規劃',`配置 ${fresh.map(k=>INSURANCE_TYPES[k].tag).join('、')}，模擬支出 ${cash(price)}`,true);render();}
function resumeAfterPlan(){state.lastPlanTurn=state.turn;if(state.planQueued){state.planQueued=false;nextLifeEvent();}else drawEvent();}function skipPlan(){addHistory('暫緩保障規劃','選擇先保留資金，未新增保障。',true);resumeAfterPlan();}
const SPIRIT_GUIDES={INTJ:['長期規劃','想想這個決定對未來的影響。',2,1,1,1],INTP:['成本分析','先比較每個選項的代價。',2,1,1,0],ENTJ:['職涯發展','考慮能否增加未來的發展空間。',1,1,1,4],ENTP:['探索機會','也許還有不同的做法。',1,1,2,3],INFJ:['人生意義','想想這是否符合你重視的生活。',1,2,3,0],INFP:['內心價值','別忽略自己真正想要的生活。',1,1,4,0],ENFJ:['人際陪伴','考慮自己與重要的人各自的需要。',1,2,3,0],ENFP:['生活探索','為新的體驗留一些空間。',1,1,4,1],ISTJ:['預算管理','先確認支出是否在負擔範圍內。',4,2,1,0],ISFJ:['健康照護','照顧別人的同時也要照顧自己。',1,4,2,0],ESTJ:['資源管理','把有限的資源用在最需要的地方。',3,1,1,2],ESFJ:['關係維護','想想如何兼顧關係與自己的界線。',1,1,4,0],ISTP:['實際解決','先處理眼前最迫切的問題。',2,3,1,0],ISFP:['身心平衡','留意這個選擇是否讓你自在。',1,3,3,0],ESTP:['把握機會','機會值得考慮，但也要承擔代價。',1,1,2,4],ESFP:['生活幸福','別忘了享受當下的美好。',1,1,5,0]};
function bond(){return state.bond||0;}
function bondLevel(){return bond()>=100?'一生的羈絆':bond()>=75?'人生知己':bond()>=50?'知心旅伴':bond()>=25?'熟悉彼此':'初次相遇';}
function spiritAdvice(){const g=SPIRIT_GUIDES[state.mbti],e=state.pending;let msg=g[1];if(state.health<30)msg+=' 你的健康只剩 '+Math.round(state.health)+'，請留意身體負擔。';if(state.money<30000)msg+=' 目前存款有限，別忽略緊急支出。';if(state.joy<35)msg+=' 最近幸福感偏低，也需要休息與支持。';if(state.screen==='plan')return msg+' 先比較保障缺口、費用與負擔能力，不必一次買齊。';if(e?.risk)return msg+' 這次模擬風險支出為 '+cash(e.cost)+'，先確認已有保障。';if(e?.choices){const score=c=>-(c.cost||0)/3000*g[2]+(c.health||0)*g[3]+(c.joy||0)*g[4]+(c.salaryBonus||0)/1000*g[5];const options=e.choices.filter(c=>isAffordable(c.cost||0));if(options.length){const best=options.reduce((a,b)=>score(a)>=score(b)?a:b);msg+=' 以我的想法，我會考慮「'+best.text+'」，但最後由你決定。';}}return msg;}
function companionPanel(){const g=SPIRIT_GUIDES[state.mbti];if(!g)return '';const alert=state.health<30||state.money<30000||state.joy<35||(state.age>=60&&state.age<65);return `<div class="companion-panel"><div class="companion-head">${fairy()}<div><b>${spiritName()}｜${g[0]}</b><p class="muted">${bondLevel()} · 羈絆 ${bond()}/100</p><progress max="100" value="${bond()}"></progress></div></div>${alert&&bond()>=25?'<p class="note warn">'+escapeHtml(state.health<30?'你的健康偏低，接下來要留意身體負擔。':state.money<30000?'存款有限，請保留緊急預備金。':state.joy<35?'最近辛苦了，記得留時間照顧自己。':'退休生活即將開始，可以盤點未來支出。')+'</p>':''}${state.adviceShown?'<p class="note">'+escapeHtml(spiritAdvice())+'</p>':btn('聽聽旅伴的想法','askSpirit')}${state.screen==='event'&&bond()>=50&&state.pending?.choices&&!state.pending.pressure&&!state.pending.spiritAdded?btn('探索旅伴的替代方案','spiritOption'):''}<p class="muted">旅伴的觀點不是標準答案。</p></div>`;}
function askSpirit(){if(!['board','event','plan'].includes(state.screen)||state.adviceShown)return;state.adviceShown=true;if(state.lastBondTurn!==state.turn){state.bond=Math.min(100,bond()+4);state.lastBondTurn=state.turn;}render();}
function spiritOption(){const e=state.pending;if(state.screen!=='event'||bond()<50||!e?.choices||e.pressure||e.spiritAdded)return;const g=SPIRIT_GUIDES[state.mbti];const base=e.choices.reduce((a,b)=>(a.cost||0)<=(b.cost||0)?a:b);e.choices=[...e.choices,{...base,text:base.text+'，並與旅伴一起反思這次選擇',joy:(base.joy||0)+1,tip:g[1]+' 保留原方案的成本與風險。'}];e.spiritAdded=true;render();}
function farewell(){const h=state.history.filter(x=>!x.title.includes('落幕')).slice(-2);return `<div class="companion-panel"><h3>${spiritName()} 的告別信</h3><p>親愛的 ${escapeHtml(state.name)}：</p>${h.map(x=>'<p>還記得 '+x.age+' 歲那年，我們一起經歷了「'+escapeHtml(x.title)+'」。</p>').join('')}<p>${escapeHtml(SPIRIT_GUIDES[state.mbti][1])} 這一路的選擇組成了獨一無二的你。謝謝你讓我陪你走到 ${state.age} 歲。</p><p>——${spiritName()} · ${bondLevel()}</p></div>`;}
function eventPage(){const e=state.pending;return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">${e.pressure?'SCARCITY DECISION':e.risk?'RISK EVENT':'DAILY LIFE'} · ${state.age} 歲</div><h2>${escapeHtml(e.title)}</h2><p class="sub">${escapeHtml(e.story)}</p>${e.risk?`<div class="note warn">這是隨機風險事件，模擬支出 ${cash(e.cost)}。系統將依先前配置的保障類別試算，實際保險是否給付須依契約條款。</div>${btn('查看風險結算','resolveRisk',true)}`:`<h3>你會怎麼選？</h3><div class="options">${choiceButtons(e.choices,'daily')}</div>`}</div></section><aside class="panel"><h2>這段人生的收入</h2><p class="sub">本回合從 ${Math.max(18,state.age-(state.roll))} 歲左右前進至 ${state.age} 歲，已結算 ${state.income<0?'-':''}${cash(Math.abs(state.income))} 的淨收支。</p><div class="note">每回合有年齡相關的健康與幸福衰減，資源不易永久滿分。選擇日常事件會影響存款、健康與幸福。你可以與不同小精靈重新體驗另一段人生。</div></aside></div>`;}
function dailyChoice(i){const e=state.pending,c=e.choices[i];if(!c||(c.cost&&state.turn<=3&&state.money-c.cost<10000))return;if(c.cost&&state.money-c.cost<=10000&&!confirm("旅伴提醒：支出後存款只剩 "+cash(state.money-c.cost)+"，確定繼續？"))return;if(!applyChoice(c))return;addHistory(e.title,`${c.text}。${c.tip}`,false);state.pending={kind:'daily',title:e.title,choice:c.text,tip:c.tip,knowledge:c.knowledge,pressure:!!e.pressure};state.screen='result';if(state.health<=0){state.deathReason='健康資源耗盡';finish();return;}render();}
function resolveRisk(){const e=state.pending;if(!e?.risk)return;const matching=e.cover.filter(k=>state.cover.includes(k));const insured=matching.length>0;const reduction=insured?Math.round(e.cost*.8):0;const nominal=e.cost-reduction;const before=state.money;const outOfPocket=Math.min(nominal,Math.max(0,Math.min(Math.floor(before*.6),before-5000)));spend(outOfPocket);state.health=clamp(state.health+e.health);state.joy=clamp(state.joy+e.joy+(insured?7:0));const exhausted=false;const detail=insured?`已配置 ${matching.map(k=>INSURANCE_TYPES[k].tag).join('、')}，遊戲模擬分攤 ${cash(reduction)}（80%）。`:'沒有符合本次事件的模擬保障，原則上需自行負擔費用。';const relief=nominal-outOfPocket;addHistory(e.title,`${detail}自付 ${cash(outOfPocket)}；遊戲支出上限減免 ${cash(relief)}。`,true);state.pending={kind:'risk',title:e.title,detail:detail+(relief>0?` 本次依遊戲支出上限減免 ${cash(relief)}，非實際醫療補助。`:""),knowledge:e.knowledge,insured,exhausted,outOfPocket,reduction};state.screen='knowledge';render();}
function resultPage(){const p=state.pending;return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">DECISION RESULT</div><h2>${escapeHtml(p.title)}</h2><p class="sub">你的選擇：${escapeHtml(p.choice)}</p><div class="note">${escapeHtml(p.tip)}</div>${btn(icon('arrow')+' 繼續人生旅程','continue',true)}</div></section><aside class="panel"><h2>日常選擇，也會改變人生</h2><p class="sub">幸福與健康不是保險的替代品；保險則是協助管理特定財務風險的工具。</p>${p.knowledge?knowledgeCard(p.knowledge):''}</aside></div>`;}
function knowledgePage(){const p=state.pending;const keys=p.kind==='purchase'?p.keys:[p.knowledge];return `<div class="layout"><section>${stage()}${hud()}<div class="panel"><div class="step">NS100 / INSURANCE KNOWLEDGE</div><h2>${p.kind==='purchase'?'保障規劃完成':p.insured?'模擬保障啟動':'發現保障缺口'}</h2><p class="sub">${p.kind==='purchase'?`本次配置 ${keys.map(k=>INSURANCE_TYPES[k].tag).join('、')}，模擬支出 ${cash(p.amount)}。`:escapeHtml(p.detail)}</p>${p.exhausted?'<div class="note warn">存款歸零、靠社會安全網與親友支援度過難關。這是教學情境，實際可用資源與資格依制度而定。</div>':''}${p.kind==='risk'?`<div class="note">本次模擬自付 ${cash(p.outOfPocket)}，模擬保障分攤 ${cash(p.reduction)}。80% 是教學假設，不是保險理賠承諾。</div>`:''}${btn(icon('arrow')+' 繼續人生旅程','continue',true)}</div></section><aside class="panel"><h2>白話保障知識卡</h2>${keys.map(knowledgeCard).join('')}</aside></div>`;}
function continueGame(){if(state.pending?.kind==="purchase"){resumeAfterPlan();return;}if(state.health<=0){state.deathReason="健康資源耗盡";finish();return;}nextLifeEvent();}
function finish(){state.screen='report';state.pending=null;render();}
function report(){const moments=state.history.filter(h=>h.important).slice(-3);const missing=Object.keys(INSURANCE_TYPES).filter(k=>!state.cover.includes(k));const healthLabel=state.health>=75?'健康維持良好':state.health>=45?'健康需要持續照顧':'健康需要優先關注';const joyLabel=state.joy>=75?'幸福感充足':state.joy>=45?'幸福感穩定':'需要更多支持與休息';return `<h1 class="lead">百歲人生實驗報告</h1><div class="layout"><section><div class="panel report"><div class="step">NS100 / PERSONAL LIFE REPORT</div><div class="report-hero">${fairy()}<div><h2>${escapeHtml(state.name)}</h2><div class="muted">旅伴：${spiritName()} · ${state.career.title}</div><p class="sub">${state.age>=100?'你完成了百歲旅程。':`本次旅程在 ${state.age} 歲提前結束：${escapeHtml(state.deathReason||'不可預期的健康危機')}。`}</p></div></div><div class="result-numbers"><div><strong>${state.age} 歲</strong><small>最終年齡</small></div><div><strong>${Math.round(state.health)}</strong><small>健康指數</small></div><div><strong>${Math.round(state.joy)}</strong><small>幸福指數</small></div></div><div class="note">${healthLabel}；${joyLabel}。最終存款 ${cash(state.money)}。</div><h3>三個關鍵轉折點</h3><p class="muted">本局經歷 ${state.pressures} 次高壓抉擇。模擬結局不代表真實個人壽命。</p><div class="history">${(moments.length?moments:state.history.slice(-3)).map(h=>`<article><b>${h.age} 歲｜${escapeHtml(h.title)}</b><p>${escapeHtml(h.desc)}</p></article>`).join('')||'<p>這次旅程沒有留下事件紀錄。</p>'}</div><h3>保障缺口健檢</h3><p class="sub">已配置 ${state.cover.length} / 7 類。${missing.length?`尚未配置：${missing.map(k=>INSURANCE_TYPES[k].tag).join('、')}。請依家庭責任、工作型態、旅行習慣與負擔能力排序，不代表每類都必須購買。`:'七類教學保障均已配置，仍須留意實際契約條款、保額及除外責任。'}</p>${btn(icon('refresh')+' 重新模擬人生','restart',true)}</div></section><aside class="panel"><h2>七大保險分類總覽與推薦圖鑑</h2><p class="muted">可逐項展開；標記本次旅程的保障配置狀態。</p>${book()}</aside></div>`;}
function render(){const app=$('app');if(!app)return;const screen=state.screen;app.innerHTML=screen==='home'?home():screen==='create'?creation():screen==='career'?careerPage():screen==='board'||screen==='rolling'?board():screen==='plan'?plan():screen==='chance'?chancePage():screen==='event'?eventPage():screen==='result'?resultPage():screen==='knowledge'?knowledgePage():report();if(['board','event','plan'].includes(screen)){const section=app.querySelector('.layout section');if(section)section.insertAdjacentHTML('beforeend',companionPanel());}if(screen==='report'){const p=app.querySelector('.report');if(p)p.insertAdjacentHTML('beforeend',farewell());}if(screen==='rolling'){const b=app.querySelector('[data-action="roll"]');if(b){b.disabled=true;b.innerHTML=`<span class="rolling">${icon('dice')}</span> 正在推進 ${state.roll} 歲…`;}}}
$('app').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled||locked)return;const [action,arg]=b.dataset.action.split(':');if(action==='enter'){state.screen='create';render();}else if(action==='spirit')answerSpirit(Number(arg));else if(action==='spiritBack'){state.answers.pop();render();}else if(action==='spiritReset'){state.answers=[];render();}else if(action==='mbti'){const n=$('player-name');if(n)state.name=n.value;state.mbti=arg;render();}else if(action==='start')start();else if(action==='careerRandom'){state.careerMode='random';render();}else if(action==='careerCustom'){state.careerMode='custom';render();}else if(action==='careerBack'){state.careerMode=null;render();}else if(action==='saveCustom')saveCustom();else if(action==='spinCareer')spinCareer();else if(action==='beginLife')beginLife();else if(action==='roll')roll();else if(action==='plan')buyPlan(Number(arg));else if(action==='skipPlan')skipPlan();else if(action==='claimChance')claimChance();else if(action==='askSpirit')askSpirit();else if(action==='spiritOption')spiritOption();else if(action==='daily')dailyChoice(Number(arg));else if(action==='resolveRisk')resolveRisk();else if(action==='continue')continueGame();else if(action==='restart'){state={screen:'home',age:18,mbti:'INTJ',name:'',money:100000,health:85,joy:65,cover:[],career:null,turn:0,salaryBonus:0,history:[],planStops:[],pending:null,previous:null,notification:'',income:0,roll:0,stageAge:18,pressures:0,deathReason:'',lastMortality:0};render();}});
render();
</script></body></html>
